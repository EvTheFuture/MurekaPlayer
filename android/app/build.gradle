plugins {
    id "com.android.application"
}

// The version string in the shared player, for example 1.6.0.1
def playerVersion() {

    def file = rootProject.file("../src/player.js")

    if (!file.exists()) {
        return "0.0.0"
    }

    def found = (file.getText("UTF-8") =~ /const VERSION = "([^"]+)"/)

    return found ? found[0][1] : "0.0.0"
}

// The same version as one increasing number, two digits per part, so
// 1.6.0.1 becomes 1060001. Anything but digits and dots is ignored
def playerVersionCode() {

    def parts = playerVersion().replaceAll(/[^0-9.]/, "").tokenize(".")
    def code = 0

    for (int i = 0; i < 4; i++) {
        code = code * 100 + (i < parts.size() ? (parts[i] as int) : 0)
    }

    return code
}

// A path from gradle.properties with ~, $HOME or ${HOME} turned into the
// home folder, since Gradle leaves them as they are
def homePath(String path) {

    if (path == null) {
        return null
    }

    def home = System.getProperty("user.home")

    return path.replaceFirst(/^~(?=\/|$)/, home)
        .replace('${HOME}', home)
        .replace('$HOME', home)
}

// The answers make asked for the first time and keeps in
// android/keystore.properties, which git ignores
def signingFile = rootProject.file("keystore.properties")
def signingProps = new Properties()

if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}

// The same settings under the names gradle.properties and the environment
// use, which win over the file when they are set
ext.signingNames = [
    MUREKA_STORE_FILE: "storeFile",
    MUREKA_STORE_PASSWORD: "storePassword",
    MUREKA_KEY_ALIAS: "keyAlias",
    MUREKA_KEY_PASSWORD: "keyPassword"
]
ext.signingProps = signingProps
ext.signingFileExists = signingFile.exists()

// A signing setting from ~/.gradle/gradle.properties, the environment or
// android/keystore.properties, in that order
def keySetting(String name) {

    def v = findProperty(name) ?: System.getenv(name) ?: signingProps.getProperty(signingNames[name])

    return v ? v.toString() : null
}

// The release key: the one named in the settings, which may start with ~
// or $HOME. Without one, a .jks, .keystore or .p12 file in ~/.android that
// is not Android's debug.keystore, one with mureka in its name first. An
// empty storeFile in keystore.properties means no key, the debug key then
def findReleaseStore() {

    def set = homePath(keySetting("MUREKA_STORE_FILE"))

    if (set) {
        return new File(set).exists() ? new File(set) : null
    }

    if (signingFileExists && signingProps.containsKey("storeFile")) {
        return null
    }

    def dir = new File(System.getProperty("user.home"), ".android")
    def found = (dir.listFiles() ?: ([] as File[])).findAll {
        it.isFile() && it.name != "debug.keystore" && (it.name ==~ /.*\.(jks|keystore|p12)/)
    }.sort { it.name }

    return found.find { it.name.toLowerCase().contains("mureka") } ?: (found ? found[0] : null)
}

// The key inside the store: MUREKA_KEY_ALIAS, or murekaplayer when the
// store has it, or the only key in it
def findKeyAlias(File store, String password) {

    def set = keySetting("MUREKA_KEY_ALIAS")

    if (set) {
        return set
    }

    try {

        def ks = java.security.KeyStore.getInstance(store, password.toCharArray())
        def aliases = Collections.list(ks.aliases()).findAll { ks.isKeyEntry(it) }

        return aliases.contains("murekaplayer") ? "murekaplayer" : (aliases.size() == 1 ? aliases[0] : null)
    } catch (Exception e) {
        logger.warn("Could not open " + store + ": " + e.message)
        return null
    }
}

// Without a store or a password the APKs are signed with the debug key,
// which only suits a phone of your own
def releaseStore = findReleaseStore()
def releasePassword = keySetting("MUREKA_STORE_PASSWORD")
def releaseAlias = releaseStore && releasePassword ? findKeyAlias(releaseStore, releasePassword) : null
def hasReleaseKey = releaseStore != null && releasePassword != null && releaseAlias != null

android {
    namespace = "dev.evthefuture.murekaplayer"
    compileSdk = 36

    defaultConfig {
        applicationId = "dev.evthefuture.murekaplayer"
        minSdk = 29
        targetSdk = 36

        // Taken from VERSION in src/player.js, so the app, the extension
        // and the bookmarklet always report the same version
        versionName = playerVersion()
        versionCode = playerVersionCode()
    }

    signingConfigs {

        // Only filled in when the key is there, so a checkout without it
        // still builds
        release {

            if (hasReleaseKey) {

                storeFile = releaseStore
                storePassword = releasePassword
                keyAlias = releaseAlias
                keyPassword = keySetting("MUREKA_KEY_PASSWORD") ?: releasePassword

                // v2 for every supported Android, v3 so the key can be
                // rotated to a new one later without a reinstall
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }

        // The debug build takes the release key too when it is there, so a
        // debug and a release build install over each other on the same
        // phone without an uninstall, which would clear the app's data
        debug {

            if (hasReleaseKey) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// Two small libraries for switching the phone's hotspot: one reaches the
// call in Android's tethering service that is left out of its public API,
// Shizuku is the way left when the phone refuses that one
dependencies {
    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}

// The player is the same file the extension and the bookmarklet use. It is
// copied in from the repository at build time, so there is only one copy
def copyPlayer = tasks.register("copyPlayer", Copy) {
    from(rootProject.file("../src/player.js"))
    into(layout.projectDirectory.dir("src/main/assets"))
}

tasks.named("preBuild") {
    dependsOn(copyPlayer)
}

// Say which key the release build is signed with, so a debug signed APK is
// never published by mistake
if (hasReleaseKey) {
    logger.lifecycle("Signing with " + releaseStore + ", key " + releaseAlias)
} else if (releaseStore == null) {
    logger.warn("No release key found in ~/.android, the APKs are signed with the debug key")
} else {
    logger.warn("The release key " + releaseStore + " could not be used, the APKs are signed with the debug key")
}
