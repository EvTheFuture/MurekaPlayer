<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1d22">
<meta name="color-scheme" content="dark">
<title>Mureka Player</title>
<style>
    :root {
        --bg: #1d1d22;
        --card: #26262c;
        --line: #3a3a42;
        --text: #eaeaec;
        --muted: #9a9aa4;
        --accent: #48e1eb;
        --gold: #f5c518;
        --dim: #7d6516;
        --empty: #6a6a74;
        --heart: #ff6b8a;

        /* One height for everything in the song list's top rows */
        --ctl-h: clamp(52px, 7vh, 68px);
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 18px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
    }

    #app {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 3vh 3vw;
        gap: 2.5vh;
    }

    #main {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 4vw;
        align-items: center;
    }

    /* The covers, drawn like the phone's cover flow. The stage lies behind
       the whole main area, so the next cover can peek out from behind the
       current one underneath the title and stars, fading into the dark */
    /* Its own stacking layer, so the title and stars lifted over the
       covers never end up over the settings and the other panels */
    #main {
        position: relative;
        isolation: isolate;
    }

    /* The stage reaches out over the page margin to the screen edges, and
       the covers fade out there instead of being cut off in a straight
       line level with the buttons. The script sets the reach and the fade */
    #artStage {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        overflow: hidden;
        z-index: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    #coverSpace {
        flex: 0 0 auto;
        height: 100%;
        pointer-events: none;
    }

    #info {
        position: relative;
        z-index: 1;
        pointer-events: none;
    }

    #info button,
    #info .star {
        pointer-events: auto;
    }

    #title,
    #subtitle,
    #upNext {
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
    }

    .tile {
        position: absolute;
        top: 50%;
        left: 0;
        border-radius: 14px;
        background: var(--card) center / cover no-repeat;
        transform-origin: 0 50%;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        will-change: transform;
    }

    .tile.empty {
        visibility: hidden;
    }

    /* The cover inside a tile, filling it, under the shade, the up next pill
       and the lyrics */
    .tileImg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: inherit;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
    }

    #cover {
        overflow: hidden;
    }

    /* Where the title and stars reach over the playing cover, its right
       side darkens towards the edge so the text stays readable */
    #coverShade {
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, rgba(29, 29, 34, 0) 45%, rgba(29, 29, 34, 0.55) 72%, rgba(29, 29, 34, 0.9) 100%);
        opacity: 0;
        pointer-events: none;
    }

    /* The lyrics roll like the phone's: five rows, the line being sung in
       the middle, the ones before and after smaller and dimmer, and a half
       line at each end that has faded away. The rows are placed by script.
       On the cover they sit at the bottom over the phone's dark scrim */
    #lyricsOver {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 30% 5% 5%;
        background: linear-gradient(to top, rgba(29, 29, 34, 0.95) 0%, rgba(29, 29, 34, 0.75) 40%, rgba(29, 29, 34, 0.35) 70%, rgba(29, 29, 34, 0) 100%);
        display: none;
        pointer-events: none;
    }

    .lyricRoll {
        position: relative;
        overflow: visible;
    }

    .lyricRoll div {
        position: absolute;
        left: 0;
        right: 0;
        opacity: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        transform-origin: left center;
        will-change: transform, opacity;
    }

    #info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2vh;
    }

    #title {
        font-size: clamp(28px, 4.2vw, 64px);
        font-weight: 700;
        line-height: 1.2;
    }

    #subtitle {
        font-size: clamp(18px, 2vw, 30px);
        color: var(--muted);
    }

    /* One line that walks across when it does not fit, like the phone's
       meta line. The padding leaves room for the text shadow, the negative
       margin keeps the spacing as it was */
    .marquee {
        overflow: hidden;
        white-space: nowrap;
        min-width: 0;
        padding: 6px 0;
        margin: -6px 0;
    }

    #rateRow {
        display: flex;
        align-items: center;
        gap: 2vw;
    }

    #stars {
        display: flex;
    }

    .star {
        background: none;
        border: none;
        padding: 8px;
        cursor: pointer;
        line-height: 0;
    }

    .star svg {
        width: clamp(40px, 4.4vw, 68px);
        height: clamp(40px, 4.4vw, 68px);
        display: block;
    }

    #like {
        background: none;
        border: none;
        line-height: 0;
        color: var(--empty);
        cursor: pointer;
        padding: 8px;
    }

    #like .ico {
        width: clamp(40px, 4.4vw, 68px);
        height: clamp(40px, 4.4vw, 68px);
    }

    #like.liked,
    .rowHeart.liked {
        color: var(--heart);
    }

    #like.liked .ico,
    .rowHeart.liked .ico {
        fill: currentColor;
    }

    .ico {
        width: 1.25em;
        height: 1.25em;
        flex: 0 0 auto;
        display: block;
    }

    .chip {
        gap: 0.5em;
    }

    .chip.iconOnly {
        padding: 0 16px;
        justify-content: center;
    }

    .chip.iconOnly .ico,
    #sound .ico,
    .soundIco .ico {
        width: 1.6em;
        height: 1.6em;
    }

    .soundIco {
        border: none;
        background: none;
        color: var(--muted);
        font: inherit;
        line-height: 0;
        padding: 0 6px;
        cursor: pointer;
    }

    /* Silent, so the speaker says so without a second icon */
    .soundIco.quiet {
        opacity: 0.4;
    }

    #seek {
        display: flex;
        align-items: center;
        gap: 2vw;
        font-variant-numeric: tabular-nums;
        font-size: clamp(18px, 1.8vw, 26px);
        color: var(--muted);
    }

    #bar {
        flex: 1;
        height: 44px;
        display: flex;
        align-items: center;
        cursor: pointer;
        touch-action: none;
    }

    #track {
        position: relative;
        width: 100%;
        height: 10px;
        border-radius: 5px;
        background: #555;
    }

    #fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        border-radius: 5px;
        background: var(--accent);
    }

    #knob {
        position: absolute;
        top: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 50%;
        background: var(--accent);
        left: 0;
    }

    #controls {
        display: flex;
        gap: 1.5vw;
    }

    .ctl {
        flex: 1 1 0;
        min-width: 0;
        height: clamp(72px, 12vh, 120px);
        border: none;
        border-radius: 16px;
        background: #333;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;

        /* The browser must not claim a held finger as a pan, that sends
           pointercancel and ends a move before it starts */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
    }

    .ctl svg {
        width: 44%;
        max-width: 56px;
        height: 56%;
    }

    .ctl.on {
        background: var(--accent);
        color: #000;
    }

    .ctl.big {
        background: var(--accent);
        color: #000;
    }

    /* Ringed rather than filled: the whole library, or something running.
       The ring is drawn inside, so the button keeps its size */
    .ctl.big.flat {
        background: #333;
        color: #fff;
    }

    .ctl.ring,
    .ctl.big.ring {
        background: #333;
        color: var(--accent);
        box-shadow: inset 0 0 0 4px var(--accent);
    }

    .chip.ring {
        background: var(--card);
        color: var(--accent);
        box-shadow: inset 0 0 0 4px var(--accent);
    }

    .chip.ring {
        border-color: var(--accent);
    }

    #bottom {
        display: flex;
        align-items: center;
        gap: 2vw;
        font-size: clamp(16px, 1.6vw, 22px);
    }

    #sound {
        display: flex;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--line);
    }

    #sound button {
        border: none;
        background: var(--card);
        color: var(--text);
        font: inherit;
        padding: 12px 22px;
        cursor: pointer;
        line-height: 0;
    }

    #sound button.off {
        opacity: 0.35;
    }

    #sound button.on {
        background: var(--accent);
        color: #000;
        font-weight: 600;
    }

    #status {
        flex: 1;
        min-width: 0;
        color: var(--muted);
        text-align: right;
    }

    #browse {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: none;
        flex-direction: column;
        padding: 2vh 3vw;
        gap: 1.4vh;
    }

    #browseTop {
        display: flex;
        gap: 1.5vw;
        align-items: center;
    }

    #search {
        flex: 1;
        min-width: 0;
        height: var(--ctl-h);
        font: inherit;
        font-size: clamp(20px, 2vw, 30px);
        padding: 0 18px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
    }

    .chipRow {
        display: flex;
        gap: 1vw;
        flex-wrap: wrap;
        align-items: center;
    }

    .chip {
        height: var(--ctl-h);
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: clamp(15px, 1.5vw, 22px);
        padding: 0 20px;
        cursor: pointer;
        white-space: nowrap;
    }

    /* Same weight on and off, a bolder label would widen the chip and push
       the ones after it along */
    /* The song list's top row in three groups: which list, how it is sorted,
       and the jump to the playing song */
    .chipGroup {
        align-self: center;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.7em;
        padding: 0 0.2em 0 0.4em;
    }

    .chipSep {
        align-self: stretch;
        width: 1px;
        margin: 10px 0.6vw;
        background: var(--line);
    }

    /* The chips that change their word have a set width, wide enough for
       the longest word they show. The script measures the exact width, this
       is the floor before and under it */
    #vocalsCycle {
        min-width: 10.5em;
    }

    #feed,
    #smart {
        min-width: 9em;
    }

    #viewAlpha {
        min-width: 6em;
    }

    #viewStars,
    #viewPlays {
        min-width: 7.5em;
    }

    #vocalsCycle,
    #feed,
    #smart,
    #viewAlpha,
    #viewStars,
    #viewPlays,
    .fromFixed {
        flex: 0 0 auto;
        justify-content: center;
    }

    .fromFixed {
        min-width: 9em;
    }

    .chip.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
    }

    #filterText {
        display: none;
        color: var(--accent);
        font-size: clamp(15px, 1.5vw, 22px);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    #controls .ctl {
        flex-direction: column;
        gap: 4px;
    }

    .ctlLbl {
        display: none;
        font-size: clamp(12px, 1.2vw, 16px);
        line-height: 1;
    }

    #controls.names .ctlLbl {
        display: block;
    }

    #controls.names .ctl svg,
    #controls.names .ctl .ico {
        height: 42%;
    }

    .pText.head {
        color: var(--accent);
        font-size: 0.8em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding-top: 20px;
    }

    .pBtn.wide {
        display: flex;
        align-items: center;
        width: 100%;
        flex: 1;
        text-align: left;
        justify-content: flex-start;
        margin: 5px 0;
    }

    .pRow {
        margin: 2px 0;
    }

    #counts {
        color: var(--muted);
        font-size: clamp(14px, 1.4vw, 20px);
    }

    #rows {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    .row {
        display: flex;
        align-items: center;
        gap: 2vw;
        width: 100%;
        text-align: left;
        border: none;
        border-bottom: 1px solid var(--line);
        background: none;
        color: var(--text);
        font: inherit;
        font-size: clamp(18px, 1.9vw, 28px);
        padding: 18px 8px;
        cursor: pointer;
    }

    .row.playing,
    .row.playing .rowNum {
        color: var(--accent);
        font-weight: 600;
    }

    /* How far the phone has come with a load, a rescan or caching */
    .workBar {
        height: 6px;
        margin: 6px 0 2px;
        border-radius: 3px;
        background: var(--card);
        overflow: hidden;
    }

    .workFill {
        height: 100%;
        background: var(--accent);
        transition: width 0.3s ease;
    }

    /* A short word about what just happened, over everything else */
    #toast {
        position: fixed;
        left: 50%;
        bottom: 6vh;
        transform: translateX(-50%);
        max-width: 80vw;
        padding: 12px 18px;
        border-radius: 12px;
        background: rgba(20, 20, 20, 0.95);
        color: var(--text);
        font-size: clamp(16px, 1.6vw, 22px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        display: none;
        z-index: 60;
    }

    /* The handle to drag a song to another place in the queue */
    .rowGrip {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1.6em;
        align-self: stretch;
        margin: -18px 0 -18px -8px;
        padding: 0 0 0 8px;
        color: var(--muted);
        cursor: grab;
        touch-action: none;
    }

    .rowGrip .ico {
        width: 1.2em;
        height: 1.2em;
    }

    .rowGrip.off {
        opacity: 0.3;
        cursor: not-allowed;
    }

    .row.dragging {
        opacity: 0.25;
    }

    /* Stands in for the remove button on rows that have none, so every
       row's columns line up */
    .rowNext.spacer {
        visibility: hidden;
        pointer-events: none;
    }

    /* The loading glyph, a turning arc like the phone's refresh icon */
    .spin {
        display: inline-block;
        width: 1.1em;
        height: 1.1em;
        vertical-align: -0.2em;
        animation: spinTurn 0.8s linear infinite;
    }

    @keyframes spinTurn {
        to {
            transform: rotate(360deg);
        }
    }

    .loadRow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6em;
        padding: 3vh 0;
        color: var(--muted);
    }

    .rowTitle {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .rowRate {
        flex: 0 0 auto;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
        font-size: 0.8em;
    }

    /* Never bold, a bolder length on the playing row would push the
       heart out of line with the rows around it */
    .rowTime {
        flex: 0 0 auto;
        font-weight: 400;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 0.85em;
    }

    .rowHeart {
        flex: 0 0 auto;
        background: none;
        border: none;
        padding: 8px;
        line-height: 0;
        color: var(--empty);
        cursor: pointer;
    }

    .rowNext .ico {
        margin: 0 auto;
    }

    .rowHeart .ico {
        width: 1.4em;
        height: 1.4em;
    }

    #edgeBtn {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #edgeBtn .ico {
        width: 1.2em;
        height: 1.2em;
    }

    .rowNext {
        flex: 0 0 auto;
        width: var(--ctl-h);
        height: var(--ctl-h);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: 1.2em;
        cursor: pointer;
    }

    .row.past {
        color: var(--muted);
    }

    .rowNum {
        flex: 0 0 auto;
        min-width: 2.4em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 0.8em;
    }

    #bottom .chip {
        height: auto;
        padding: 14px 22px;
        border-radius: 12px;
    }

    .sheet {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: none;
        flex-direction: column;
        padding: 2vh 3vw;
        gap: 1.4vh;
    }

    /* On a wide screen the settings and the other panels stay a readable
       column in the middle instead of stretching edge to edge */
    #panel {
        background: #111114;
        align-items: center;
    }

    .sheetInner {
        width: min(1000px, 100%);
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 1.4vh;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 2vh 0 2vh 2.5vw;
    }

    /* The settings scroll in a box that reaches the right edge of the
       background, and the content keeps its distance inside it, so the
       scrollbar, also one drawn over the page, runs along the edge and
       never across the buttons */
    .sheetInner .sheetTop,
    #panelBody {
        padding-right: 2.5vw;
    }

    #panelScroll {
        border-radius: 0 0 18px 0;
    }

    .row {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
    }

    .row.pressing {
        background: #2a2a31;
    }

    #songMenu,
    #helpPop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
    }

    #menuBox,
    #actionsBox,
    #helpBox {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 2vh 2vw;
        width: min(640px, 92vw);
        max-height: 88vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    #menuBox > *,
    #actionsBox > *,
    #helpBox > * {
        flex-shrink: 0;
    }

    #menuBox {
        width: min(900px, 94vw);
    }

    /* Two columns of choices where there is room, so the whole menu and its
       stars fit on a wide screen without scrolling */
    #menuItems,
    #actionItems {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 12px;
    }

    @media (max-width: 700px) {

        #menuItems,
        #actionItems {
            grid-template-columns: 1fr;
        }
    }

    #menuTitle,
    /* The playing song's title over its own choices in the actions menu */
    .actionsSong {
        grid-column: 1 / -1;
        margin-top: 1.5vh;
        padding: 10px 6px 4px;
        border-top: 1px solid var(--line);
        color: var(--accent);
        font-weight: 600;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .actionsSong .loadRow {
        justify-content: flex-start;
        padding: 0;
    }

    /* The player's version, small at the foot of the actions and the help */
    .versionLine {
        padding: 1.4vh 6px 0;
        color: var(--muted);
        font-size: 0.7em;
        text-align: right;
        opacity: 0.7;
    }

    #actionsTitle,
    #helpTitle {
        font-size: clamp(20px, 2.2vw, 30px);
        font-weight: 700;
        padding: 4px 6px 10px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .menuItem {
        display: flex;
        align-items: center;
        gap: 1em;
        min-height: var(--ctl-h);
        border: none;
        border-radius: 12px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: clamp(17px, 1.8vw, 24px);
        text-align: left;
        padding: 0 14px;
        cursor: pointer;
    }

    .menuItem:hover {
        background: #303038;
    }

    .menuItem.danger {
        color: #ff8a8a;
    }

    .menuItem.accent {
        color: var(--accent);
    }

        visibility: visible;

    #overlayChoices {

<body>
<div id="app">

        <span id="left">-0:00</span>

    // Turn a one line box into a marquee, the phone's makeMarquee. The text
    // waits at the start, eases into a steady walk to the left until it and
    // a gap have passed, a second copy following on, eases to a stop exactly
    // where it began and waits again, so the beginning is always readable.
    // A line that fits just sits still
    const MARQUEE_DELAY = 3000;
    const MARQUEE_SPEED = 60;
    const MARQUEE_GAP = 90;
    const marquees = [];

    function makeMarquee(box) {

        const track = document.createElement("span");
        const first = document.createElement("span");
        const second = document.createElement("span");
        const align = getComputedStyle(box).textAlign;

        track.style.cssText = "display:inline-block;white-space:nowrap;will-change:transform";
        first.style.cssText = "display:inline-block;white-space:nowrap";
        second.style.cssText = "display:none;white-space:nowrap";
        first.textContent = box.textContent;
        track.appendChild(first);
        track.appendChild(second);
        box.textContent = "";
        box.appendChild(track);

        let anim = null;
        let timer = null;
        let width = 0;

        const stop = function () {

            if (timer) {

                clearTimeout(timer);
                timer = null;
            }

            if (anim) {

                anim.cancel();
                anim = null;
            }

            track.style.transform = "none";
            first.style.marginRight = "0px";
            second.style.display = "none";
            box.style.textAlign = align;
        };

        const start = function () {

            if (!track.animate || !first.textContent) {
                return;
            }

            const textWidth = Math.ceil(first.getBoundingClientRect().width);

            width = box.clientWidth;

            if (textWidth - width <= 2) {
                return;
            }

            // A right aligned line walks from its start like any other
            box.style.textAlign = "left";
            first.style.marginRight = MARQUEE_GAP + "px";
            second.style.display = "inline-block";

            const distance = textWidth + MARQUEE_GAP;

            anim = track.animate([
                { transform: "translateX(0)", offset: 0, easing: "ease-in" },
                { transform: "translateX(" + (-distance * 0.05) + "px)", offset: 0.09, easing: "linear" },
                { transform: "translateX(" + (-distance * 0.95) + "px)", offset: 0.91, easing: "ease-out" },
                { transform: "translateX(" + (-distance) + "px)", offset: 1 }
            ], { duration: distance / MARQUEE_SPEED * 1000 });

            anim.onfinish = function () {

                anim = null;
                track.style.transform = "none";
                timer = setTimeout(function () {

                    timer = null;
                    start();
                }, MARQUEE_DELAY);
            };
        };

        const restart = function (wait) {

            stop();
            timer = setTimeout(function () {

                timer = null;
                start();
            }, wait);
        };

        const m = {
            setText: function (text) {

                const value = text || "";

                if (first.textContent === value) {
                    return;
                }

                first.textContent = value;
                second.textContent = value;

            check: function () {

                    width = box.clientWidth;
                    restart(600);
                }
            }
        };

        marquees.push(m);

        return m;
    }

    // The waveform bars, played part in the accent colour, redrawn only
    // when the played part or the size moved on
    let waveShown = -1;

    function drawWave(frac) {

        const canvas = $("wave");
        const data = state && state.wave ? state.wave : null;

        if (!data || canvas.style.display === "none") {
            return;
        }

        const dpr = window.devicePixelRatio || 1;
        const w = Math.round(canvas.clientWidth * dpr);
        const h = Math.round(canvas.clientHeight * dpr);
        const barW = 3 * dpr;
        const gap = 2 * dpr;
        const count = Math.max(1, Math.floor(w / (barW + gap)));
        const played = Math.round(frac * count);
        const key = played * 100000 + w;

        if (w === 0 || h === 0 || key === waveShown) {
            return;
        }

        waveShown = key;

        if (canvas.width !== w || canvas.height !== h) {

            canvas.width = w;
            canvas.height = h;
        }

        const ctx = canvas.getContext("2d");

        ctx.clearRect(0, 0, w, h);

        for (let i = 0; i < count; i++) {

            const a = Math.floor(i * data.length / count);
            const b = Math.max(a + 1, Math.floor((i + 1) * data.length / count));
            let peak = 0;

            for (let j = a; j < b; j++) {

                if (data[j] > peak) {
                    peak = data[j];
                }
            }

            const bh = Math.max(2 * dpr, peak * (h - 2 * dpr));

            ctx.fillStyle = i < played ? "#48e1eb" : "#555";
            ctx.fillRect(i * (barW + gap), (h - bh) / 2, barW, bh);
        }
    }

    // The synced lyrics, rolling exactly like the phone's. Five rows, each
    // with its own place, size, colour and opacity: half a line above that
    // has faded out, the line before, the line being sung, the line after,
    // and half a line below faded out. All rows share one line height, so
    // the gaps stay even whatever the sizes. When the song moves on a line,
    // every row takes the text of the row below and animates from that
    // row's place, size, colour and opacity into its own, so a line grows
    // and brightens as it reaches the middle and shrinks and fades as it
    // leaves over the top, like text on a turning cylinder. A jump, a seek
    // or a new song just puts the rows in place. The sizes come from the
    // phone: the web view's lyric size, and the mobile player's side line
    // percent, line spacing and side offset unless the web view sets its own
    function makeLyricRoll(roll) {

        const slots = [];

        for (let i = 0; i < 5; i++) {

            const el = document.createElement("div");

            roll.appendChild(el);
            slots.push(el);
        }

        return { roll: roll, slots: slots, geo: null, key: "", idx: -2 };
    }

    // Where the five rows rest, the phone's computeLyricSlots
    function lyricGeometry(box, layout) {

        const base = Math.max(10, layout.size);
        const side = Math.round(base * layout.side);
        const edge = Math.round(side * 0.7);
        const lineH = Math.round(base * layout.line);
        const half = Math.round(lineH * 0.5);
        const sx = layout.sideShift;
        const prevY = half;
        const curY = prevY + lineH;
        const nextY = curY + lineH;
        const dim = "#dddddd";
        const white = "#ffffff";

        box.geo = [
            { y: prevY - half, x: sx, size: edge, color: dim, op: 0, z: 0, w: 400 },
            { y: prevY, x: sx, size: side, color: dim, op: 0.75, z: 2, w: 400 },
            { y: curY, x: 0, size: base, color: white, op: 1, z: 3, w: 600 },
            { y: nextY, x: sx, size: side, color: dim, op: 0.75, z: 2, w: 400 },
            { y: nextY + half, x: sx, size: edge, color: dim, op: 0, z: 0, w: 400 }
        ];
        box.roll.style.height = (nextY + half + lineH) + "px";

        for (let i = 0; i < 5; i++) {

            const g = box.geo[i];
            const el = box.slots[i];

            el.style.top = g.y + "px";
            el.style.left = g.x + "px";
            el.style.fontSize = g.size + "px";
            el.style.lineHeight = lineH + "px";
            el.style.height = lineH + "px";
            el.style.color = g.color;
            el.style.zIndex = String(g.z);
            el.style.fontWeight = String(g.w);
        }
    }

    // Put the rows in place at once
    function setLyricRows(box, texts) {

        for (let i = 0; i < 5; i++) {

            cancelAnimations(el);
            el.textContent = texts[i];
            el.style.transform = "translate(0px, 0px) scale(1)";
            el.style.color = dest.color;

                    color: from.color,

                const key = [layout.size, layout.side, layout.line, layout.sideShift].join(",");

        for (let i = 0; i < rows.length; i++) {

        const el = onCover ? $("lyricsOver") : $("lyrics");
