<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1d22">
<title>Mureka Player</title>
<style>
    :root {
        --bg: #1d1d22;
        --card: #26262c;
        --line: #3a3a42;
        --text: #eaeaec;
        --muted: #9a9aa4;
        --accent: #48e1eb;
        --gold: #f5c518;
        --dim: #7d6516;
        --empty: #6a6a74;
        --heart: #ff6b8a;

        /* One height for everything in the song list's top rows */
        --ctl-h: clamp(52px, 7vh, 68px);
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 18px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
    }

    #app {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 3vh 3vw;
        gap: 2.5vh;
    }

    #main {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 4vw;
        align-items: center;
    }

    /* The covers, drawn like the phone's cover flow. The stage lies behind
       the whole main area, so the next cover can peek out from behind the
       current one underneath the title and stars, fading into the dark */
    /* Its own stacking layer, so the title and stars lifted over the
       covers never end up over the settings and the other panels */
    #main {
        position: relative;
        isolation: isolate;
    }

    /* The stage reaches out over the page margin to the screen edges, and
       the covers fade out there instead of being cut off in a straight
       line level with the buttons. The script sets the reach and the fade */
    #artStage {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        overflow: hidden;
        z-index: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    #coverSpace {
        flex: 0 0 auto;
        height: 100%;
        pointer-events: none;
    }

    #info {
        position: relative;
        z-index: 1;
        pointer-events: none;
    }

    #info button,
    #info .star {
        pointer-events: auto;
    }

    #title,
    #subtitle,
    #upNext {
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
    }

    .tile {
        position: absolute;
        top: 50%;
        left: 0;
        border-radius: 14px;
        background: var(--card) center / cover no-repeat;
        transform-origin: 0 50%;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        will-change: transform;
    }

    .tile.empty {
        visibility: hidden;
    }

    #cover {
        overflow: hidden;
    }

    /* Where the title and stars reach over the playing cover, its right
       side darkens towards the edge so the text stays readable */
    #coverShade {
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, rgba(29, 29, 34, 0) 45%, rgba(29, 29, 34, 0.55) 72%, rgba(29, 29, 34, 0.9) 100%);
        opacity: 0;
        pointer-events: none;
    }

    /* The lyrics roll like the phone's: five rows, the line being sung in
       the middle, the ones before and after smaller and dimmer, and a half
       line at each end that has faded away. The rows are placed by script.
       On the cover they sit at the bottom over the phone's dark scrim */
    #lyricsOver {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 30% 5% 5%;
        background: linear-gradient(to top, rgba(29, 29, 34, 0.95) 0%, rgba(29, 29, 34, 0.75) 40%, rgba(29, 29, 34, 0.35) 70%, rgba(29, 29, 34, 0) 100%);
        display: none;
        pointer-events: none;
    }

    .lyricRoll {
        position: relative;
        overflow: visible;
    }

    .lyricRoll div {
        position: absolute;
        left: 0;
        right: 0;
        opacity: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        transform-origin: left center;
        will-change: transform, opacity;
    }

    #info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2vh;
    }

    #title {
        font-size: clamp(28px, 4.2vw, 64px);
        font-weight: 700;
        line-height: 1.2;
    }

    #subtitle {
        font-size: clamp(18px, 2vw, 30px);
        color: var(--muted);
    }

    /* One line that walks across when it does not fit, like the phone's
       meta line. The padding leaves room for the text shadow, the negative
       margin keeps the spacing as it was */
    .marquee {
        overflow: hidden;
        white-space: nowrap;
        min-width: 0;
        padding: 6px 0;
        margin: -6px 0;
    }

    #rateRow {
        display: flex;
        align-items: center;
        gap: 2vw;
    }

    #stars {
        display: flex;
    }

    .star {
        background: none;
        border: none;
        padding: 8px;
        cursor: pointer;
        line-height: 0;
    }

    .star svg {
        width: clamp(40px, 4.4vw, 68px);
        height: clamp(40px, 4.4vw, 68px);
        display: block;
    }

    #like {
        background: none;
        border: none;
        line-height: 0;
        color: var(--empty);
        cursor: pointer;
        padding: 8px;
    }

    #like .ico {
        width: clamp(40px, 4.4vw, 68px);
        height: clamp(40px, 4.4vw, 68px);
    }

    #like.liked,
    .rowHeart.liked {
        color: var(--heart);
    }

    #like.liked .ico,
    .rowHeart.liked .ico {
        fill: currentColor;
    }

    .ico {
        width: 1.25em;
        height: 1.25em;
        flex: 0 0 auto;
        display: block;
    }

    .chip {
        gap: 0.5em;
    }

    .chip.iconOnly {
        padding: 0 16px;
        justify-content: center;
    }

    .chip.iconOnly .ico,
    #sound .ico,
    .soundIco .ico {
        width: 1.6em;
        height: 1.6em;
    }

    .soundIco {
        color: var(--muted);
        line-height: 0;
    }

    #seek {
        display: flex;
        align-items: center;
        gap: 2vw;
        font-variant-numeric: tabular-nums;
        font-size: clamp(18px, 1.8vw, 26px);
        color: var(--muted);
    }

    #bar {
        flex: 1;
        height: 44px;
        display: flex;
        align-items: center;
        cursor: pointer;
        touch-action: none;
    }

    #track {
        position: relative;
        width: 100%;
        height: 10px;
        border-radius: 5px;
        background: #555;
    }

    #fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        border-radius: 5px;
        background: var(--accent);
    }

    #knob {
        position: absolute;
        top: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 50%;
        background: var(--accent);
        left: 0;
    }

    #controls {
        display: flex;
        gap: 1.5vw;
    }

    .ctl {
        flex: 1 1 0;
        min-width: 0;
        height: clamp(72px, 12vh, 120px);
        border: none;
        border-radius: 16px;
        background: #333;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;

        /* The browser must not claim a held finger as a pan, that sends
           pointercancel and ends a move before it starts */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
    }

    .ctl svg {
        width: 44%;
        max-width: 56px;
        height: 56%;
    }

    .ctl.on {
        background: var(--accent);
        color: #000;
    }

    .ctl.big {
        background: var(--accent);
        color: #000;
    }

    #bottom {
        display: flex;
        align-items: center;
        gap: 2vw;
        font-size: clamp(16px, 1.6vw, 22px);
    }

    #sound {
        display: flex;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--line);
    }

    #sound button {
        border: none;
        background: var(--card);
        color: var(--text);
        font: inherit;
        padding: 12px 22px;
        cursor: pointer;
        line-height: 0;
    }

    #sound button.on {
        background: var(--accent);
        color: #000;
        font-weight: 600;
    }

    #status {
        flex: 1;
        min-width: 0;
        color: var(--muted);
        text-align: right;
    }

    #browse {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: none;
        flex-direction: column;
        padding: 2vh 3vw;
        gap: 1.4vh;
    }

    #browseTop {
        display: flex;
        gap: 1.5vw;
        align-items: center;
    }

    #search {
        flex: 1;
        min-width: 0;
        height: var(--ctl-h);
        font: inherit;
        font-size: clamp(20px, 2vw, 30px);
        padding: 0 18px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
    }

    .chipRow {
        display: flex;
        gap: 1vw;
        flex-wrap: wrap;
        align-items: center;
    }

    .chip {
        height: var(--ctl-h);
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: clamp(15px, 1.5vw, 22px);
        padding: 0 20px;
        cursor: pointer;
        white-space: nowrap;
    }

    /* Same weight on and off, a bolder label would widen the chip and push
       the ones after it along */
    .chip.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
    }

    #filterText {
        display: none;
        color: var(--accent);
        font-size: clamp(15px, 1.5vw, 22px);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    #controls .ctl {
        flex-direction: column;
        gap: 4px;
    }

    .ctlLbl {
        display: none;
        font-size: clamp(12px, 1.2vw, 16px);
        line-height: 1;
    }

    #controls.names .ctlLbl {
        display: block;
    }

    #controls.names .ctl svg,
    #controls.names .ctl .ico {
        height: 42%;
    }

    .pText.head {
        color: var(--accent);
        font-size: 0.8em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding-top: 20px;
    }

    .pBtn.wide {
        display: flex;
        width: 100%;
        flex: 1;
        text-align: left;
        justify-content: flex-start;
        margin: 5px 0;
    }

    .pRow {
        margin: 2px 0;
    }

    #counts {
        color: var(--muted);
        font-size: clamp(14px, 1.4vw, 20px);
    }

    #rows {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    .row {
        display: flex;
        align-items: center;
        gap: 2vw;
        width: 100%;
        text-align: left;
        border: none;
        border-bottom: 1px solid var(--line);
        background: none;
        color: var(--text);
        font: inherit;
        font-size: clamp(18px, 1.9vw, 28px);
        padding: 18px 8px;
        cursor: pointer;
    }

    .row.playing,
    .row.playing .rowNum {
        color: var(--accent);
        font-weight: 600;
    }

    /* Stands in for the remove button on rows that have none, so every
       row's columns line up */
    .rowNext.spacer {
        visibility: hidden;
        pointer-events: none;
    }

    /* The loading glyph, a turning arc like the phone's refresh icon */
    .spin {
        display: inline-block;
        width: 1.1em;
        height: 1.1em;
        vertical-align: -0.2em;
        animation: spinTurn 0.8s linear infinite;
    }

    @keyframes spinTurn {
        to {
            transform: rotate(360deg);
        }
    }

    .loadRow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6em;
        padding: 3vh 0;
        color: var(--muted);
    }

    .rowTitle {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .rowRate {
        flex: 0 0 auto;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
        font-size: 0.8em;
    }

    /* Never bold, a bolder length on the playing row would push the
       heart out of line with the rows around it */
    .rowTime {
        flex: 0 0 auto;
        font-weight: 400;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 0.85em;
    }

    .rowHeart {
        flex: 0 0 auto;
        background: none;
        border: none;
        padding: 8px;
        line-height: 0;
        color: var(--empty);
        cursor: pointer;
    }

    .rowNext .ico {
        margin: 0 auto;
    }

    .rowHeart .ico {
        width: 1.4em;
        height: 1.4em;
    }

    #edgeBtn {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #edgeBtn .ico {
        width: 1.2em;
        height: 1.2em;
    }

    .rowNext {
        flex: 0 0 auto;
        width: var(--ctl-h);
        height: var(--ctl-h);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: 1.2em;
        cursor: pointer;
    }

    .row.past {
        color: var(--muted);
    }

    .rowNum {
        flex: 0 0 auto;
        min-width: 2.4em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 0.8em;
    }

    #bottom .chip {
        height: auto;
        padding: 14px 22px;
        border-radius: 12px;
    }

    .sheet {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: none;
        flex-direction: column;
        padding: 2vh 3vw;
        gap: 1.4vh;
    }

    /* On a wide screen the settings and the other panels stay a readable
       column in the middle instead of stretching edge to edge */
    #panel {
        background: #111114;
        align-items: center;
    }

    .sheetInner {
        width: min(1000px, 100%);
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 1.4vh;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 2vh 0 2vh 2.5vw;
    }

    /* The settings scroll in a box that reaches the right edge of the
       background, and the content keeps its distance inside it, so the
       scrollbar, also one drawn over the page, runs along the edge and
       never across the buttons */
    .sheetInner .sheetTop,
    #panelBody {
        padding-right: 2.5vw;
    }

    #panelScroll {
        border-radius: 0 0 18px 0;
    }

    .row {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
    }

    .row.pressing {
        background: #2a2a31;
    }

    #songMenu,
    #helpPop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
    }

    #menuBox,
    #actionsBox,
    #helpBox {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 2vh 2vw;
        width: min(640px, 92vw);
        max-height: 88vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    #menuBox > *,
    #actionsBox > *,
    #helpBox > * {
        flex-shrink: 0;
    }

    #menuBox {
        width: min(900px, 94vw);
    }

    /* Two columns of choices where there is room, so the whole menu and its
       stars fit on a car screen without scrolling */
    #menuItems,
    #actionItems {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 12px;
    }

    @media (max-width: 700px) {

        #menuItems,
        #actionItems {
            grid-template-columns: 1fr;
        }
    }

    #menuTitle,
    #actionsTitle,
    #helpTitle {
        font-size: clamp(20px, 2.2vw, 30px);
        font-weight: 700;
        padding: 4px 6px 10px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .menuItem {
        display: flex;
        align-items: center;
        gap: 1em;
        min-height: var(--ctl-h);
        border: none;
        border-radius: 12px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: clamp(17px, 1.8vw, 24px);
        text-align: left;
        padding: 0 14px;
        cursor: pointer;
    }

    .menuItem:hover {
        background: #303038;
    }

    .menuItem.danger {
        color: #ff8a8a;
    }

    .menuItem.accent {
        color: var(--accent);
    }

    .menuItem:disabled {
        opacity: 0.4;
    }

    .menuItem .ico {
        width: 1.3em;
        height: 1.3em;
    }

    #menuStars {
        display: flex;
        justify-content: center;
        border-top: 1px solid var(--line);
        margin-top: 6px;
        padding-top: 10px;
    }

    #menuStars .star svg {
        width: clamp(48px, 6vw, 80px);
        height: clamp(48px, 6vw, 80px);
    }

    #bpmRow {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
    }

    #bpmInput {
        width: 6em;
        min-height: var(--ctl-h);
        font: inherit;
        font-size: 1.2em;
        text-align: center;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
    }

    .helpRow {
        display: flex;
        gap: 1.5em;
        padding: 6px;
        font-size: clamp(16px, 1.6vw, 22px);
    }

    .helpKey {
        flex: 0 0 5em;
        color: var(--accent);
        font-weight: 700;
        text-align: right;
    }

    .sheetTop {
        display: flex;
        gap: 1.5vw;
        align-items: flex-start;
    }

    .sheetTitle {
        flex: 1;
        min-width: 0;
        font-size: clamp(22px, 2.4vw, 34px);
        font-weight: 700;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    /* Room for the scrollbar beside the controls, not on top of them. The
       page pushes each scrolling box out to the right by the bar's width,
       so the content keeps the same distance from both edges */
    .sheetBody,
    #rows,
    #menuBox,
    #actionsBox,
    #helpBox {
        scrollbar-gutter: stable;
    }

    #confirmPop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
    }

    #confirmBox {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 3vh 3vw;
        width: min(560px, 92vw);
        display: flex;
        flex-direction: column;
        gap: 2vh;
        font-size: clamp(18px, 1.9vw, 26px);
    }

    #confirmBtns {
        display: flex;
        gap: 2vw;
    }

    #confirmBtns .chip {
        flex: 1;
        justify-content: center;
    }

    #confirmYes.danger {
        background: #5a1f2b;
        border-color: #5a1f2b;
        color: #fff;
    }

    .sheetBody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        font-size: clamp(17px, 1.8vw, 26px);
    }

    .pText {
        padding: 12px 4px 4px;
        color: var(--text);
    }

    .pText.small {
        padding-top: 2px;
        color: var(--muted);
        font-size: 0.8em;
    }

    /* An explanation keeps to the label column and wraps before the
       switches and steppers on the right. The script measures how wide
       their column is */
    #panelBody > .pText.small {
        padding-right: calc(var(--ctl-col, 0px) + 1vw);
    }

    .pRow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1vw;
        padding: 6px 0;
    }

    .pRow > .pText {
        flex: 1 1 auto;
        padding: 0 4px;
    }

    .pBtn,
    .pClick {
        min-height: var(--ctl-h);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        padding: 8px 20px;
        cursor: pointer;
        margin: 4px 0;
    }

    .pClick {
        display: block;
        width: 100%;
        text-align: left;
    }

    .pBtn.on,
    .pClick.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
        font-weight: 600;
    }

    .pBtn:disabled {
        opacity: 0.4;
    }

    .pField,
    .pSelect {
        min-height: var(--ctl-h);
        font: inherit;
        padding: 0 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        margin: 4px 0;
        max-width: 100%;
    }

    .pField {
        flex: 1 1 12em;
    }

    }

    #rowsWrap {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }

    #edgeBtn {
        position: absolute;

        bottom: 2vh;

        height: calc(var(--ctl-h) * 1.2);

        background: var(--accent);

        font: inherit;
        font-size: 1.6em;

        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;

    .chip:disabled {
        opacity: 0.4;
    }

    .pClick.split {
        display: flex;
        align-items: center;
        gap: 1vw;
    }

        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .pClick .pCount {
        flex: 0 0 auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }

        color: #000;
    }

    .ctl.dragging {
        opacity: 0.6;
        outline: 3px solid var(--accent);
    }

    .ctl.holding {
        transform: scale(0.94);

    }

    #controls .ctl .ico {
        width: 44%;
        max-width: 56px;
        height: 56%;
    }

    #ratePop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
    }

    #rateBox {
        background: var(--card);
        border-radius: 18px;
        padding: 3vh 3vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2vh;
        max-width: 90vw;
    }

    #rateTitle {
        font-size: clamp(22px, 2.4vw, 34px);
        font-weight: 700;
        max-width: 80vw;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    #rateStars {
        display: flex;
    }

    #rateStars .star svg {
        width: clamp(64px, 8vw, 110px);
        height: clamp(64px, 8vw, 110px);
    }

    #rateCaption {
        color: var(--muted);
        font-size: clamp(18px, 1.9vw, 26px);
    }

    .rowNum {
        text-align: right;
    }

    .rowDot {
        flex: 0 0 auto;
        width: 0.6em;
        height: 0.6em;
        border-radius: 50%;
        visibility: hidden;
    }

    .rowDot.both {
        visibility: visible;
        background: #48e1eb;
    }

    .rowDot.audio {
        visibility: visible;
        background: #b388ff;
    }

    .rowDot.art {
        visibility: visible;
        background: #f0a94a;
    }

    .rowDot.caching {
        visibility: visible;
        background: #48e1eb;
        animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {

        50% {
            opacity: 0.2;
        }
    }

    #lyrics {
        display: none;
    }

    #actionsPop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
    }

    #blackout {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        cursor: none;
    }

    #blackMark {
        position: absolute;
        color: #333;
        font-size: 64px;
        transition: left 2s, top 2s;
    }

    .rowRate {
        min-width: 3.2em;
        text-align: right;
    }

    .rowRate.zero {
        color: var(--empty);
    }

    .rowBadge {
        flex: 0 0 auto;
        width: 4.2em;
        border-radius: 6px;
        font-size: 0.65em;
        line-height: 1.8;
        text-align: center;
        background: #2f3a3c;
        color: var(--accent);
    }

    .rowBadge.draft {
        background: #3a3226;
        color: #f0a94a;
    }

    .ceLabel {
        color: var(--muted);
        font-size: 0.85em;
        padding: 10px 4px 4px;
    }

    .ceRow {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        min-height: calc(var(--ctl-h) + 20px);
        padding: 10px;
        border: 2px dashed var(--line);
        border-radius: 12px;
        background: var(--card);
        touch-action: none;
    }

    .ceChip {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-width: calc(var(--ctl-h) * 1.3);
        height: calc(var(--ctl-h) * 1.1);
        border: none;
        border-radius: 12px;
        background: #333;
        color: #fff;
        font: inherit;
        font-size: 0.7em;
        cursor: grab;
        touch-action: none;
    }

    .ceChip .ico {
        width: 1.9em;
        height: 1.9em;
    }

    .ceChip.dragging {
        opacity: 0.4;
        outline: 3px solid var(--accent);
    }

    #signin {
        display: none;
        background: #5a1f2b;
        color: #fff;
        border-radius: 12px;
        padding: 14px 20px;
        font-size: clamp(18px, 1.9vw, 26px);
    }

    #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 3vh;
        font-size: clamp(22px, 2.4vw, 34px);
        text-align: center;
        padding: 5vw;
    }

    #overlay button {
        border: none;
        border-radius: 16px;
        padding: 24px 40px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }

    #resume {
        background: var(--accent);
        color: #000;
    }

    #toPhone {
        background: #333;
        color: #fff;
    }

    @media (max-aspect-ratio: 1/1) {

        #main {
            flex-direction: column;
            align-items: stretch;
        }

        #coverSpace {
            height: 45vh;
            width: 100%;
        }
    }

    function icon(name) {

        const svg = document.createElementNS(NS, "svg");

        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke", "currentColor");
        svg.setAttribute("stroke-width", "2");
        svg.setAttribute("stroke-linecap", "round");
        svg.setAttribute("stroke-linejoin", "round");
        svg.setAttribute("aria-hidden", "true");
        svg.classList.add("ico");

        for (const shape of ICONS[name] || []) {

            const el = document.createElementNS(NS, shape[0]);

            for (const key of Object.keys(shape[1])) {
                el.setAttribute(key, shape[1][key]);
            }

            svg.appendChild(el);
        }

        return svg;
    }

    // Swap the icon of a button, keeping its label
    function setIcon(el, name) {

        const old = el.querySelector(".ico");
        const fresh = icon(name);

        if (old) {
            el.replaceChild(fresh, old);
        } else {
            el.insertBefore(fresh, el.firstChild);
        }
    }

    function setLabel(el, text) {

        const lbl = el.querySelector(".lbl");

    const STAR_D = "M12 2.6l2.83 5.9 6.47.78-4.77 4.47 1.24 6.43L12 17.02"
        + "l-5.77 3.16 1.24-6.43L2.7 9.28l6.47-.78z";

    function fmt(sec) {

        sec = Math.max(0, Math.floor(sec || 0));

        return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
    }

    // Where the song is now, as far as this page can tell
    function position() {

        if (!state) {
            return 0;
        }

        let p = state.position || 0;

        if (state.playing) {
            p += (Date.now() - stateAt) / 1000;
        }

        return state.duration ? Math.min(p, state.duration) : p;
    }

    function send(cmd, arg) {

        return fetch("/cmd", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ cmd: cmd, arg: arg === undefined ? null : arg })
        }).catch(function () {
        });

    // Five stars, each with a gold half under a clip, like the player. A
    // tap on star n goes through the same cycle as the phone's stars. Used
    // on the main screen and in the large rating popup
    function makeStarBar(box, prefix, onTap) {

        const bar = [];

        for (let n = 1; n <= 5; n++) {

            const btn = document.createElement("button");
            const svg = document.createElementNS(NS, "svg");
            const defs = document.createElementNS(NS, "defs");
            const clip = document.createElementNS(NS, "clipPath");
            const rect = document.createElementNS(NS, "rect");
            const outline = document.createElementNS(NS, "path");
            const half = document.createElementNS(NS, "path");

            btn.className = "star";
            btn.type = "button";
            btn.setAttribute("aria-label", n + (n === 1 ? " star" : " stars"));

            svg.setAttribute("viewBox", "0 0 24 24");
            clip.setAttribute("id", prefix + n);
            rect.setAttribute("x", "-2");
            rect.setAttribute("y", "-2");
            rect.setAttribute("width", "14");
            rect.setAttribute("height", "28");
            clip.appendChild(rect);
            defs.appendChild(clip);

            outline.setAttribute("d", STAR_D);
            outline.setAttribute("stroke-width", "1.6");
            outline.setAttribute("stroke-linejoin", "round");

            half.setAttribute("d", STAR_D);

            // Colours go through style, attributes do not understand var()
            half.style.fill = "var(--gold)";
            half.style.stroke = "var(--gold)";
            half.setAttribute("stroke-width", "1.6");
            half.setAttribute("stroke-linejoin", "round");
            half.setAttribute("clip-path", "url(#" + prefix + n + ")");

            svg.appendChild(defs);
            svg.appendChild(outline);
            svg.appendChild(half);
            btn.appendChild(svg);

            btn.addEventListener("click", function (ev) {

                ev.stopPropagation();

                if (onTap) {
                    onTap(n);
                } else {
                    send("rate", n);
                }
            });

            box.appendChild(btn);
            bar.push({ outline: outline, half: half });
        }

        return function paint(r) {

            bar.forEach(function (st, i) {

                const n = i + 1;
                const rated = r !== null && r !== undefined;
                let level = 0;

                if (rated && r > n - 1) {
                    level = r >= n ? 1 : 0.5;
                }

                st.outline.style.fill = level === 1 ? "var(--gold)" : "none";
                st.outline.style.stroke = level === 1 ? "var(--gold)" : (rated ? "var(--dim)" : "var(--empty)");
                st.half.style.display = level === 0.5 ? "" : "none";
            });
        };
    }

    const paintMainStars = makeStarBar($("stars"), "half");
    const paintPopupStars = makeStarBar($("rateStars"), "phalf");

    function paintStars(r) {

        paintMainStars(r);

    }

    // Everything that follows the state, drawn when a new one arrives

    // Turn a one line box into a marquee, the phone's makeMarquee. The text
    // waits at the start, eases into a steady walk to the left until it and
    // a gap have passed, a second copy following on, eases to a stop exactly
    // where it began and waits again, so the beginning is always readable.
    // A line that fits just sits still
    const MARQUEE_DELAY = 3000;
    const MARQUEE_SPEED = 60;
    const MARQUEE_GAP = 90;
    const marquees = [];

    function makeMarquee(box) {

        const track = document.createElement("span");
        const first = document.createElement("span");
        const second = document.createElement("span");
        const align = getComputedStyle(box).textAlign;

        track.style.cssText = "display:inline-block;white-space:nowrap;will-change:transform";
        first.style.cssText = "display:inline-block;white-space:nowrap";
        second.style.cssText = "display:none;white-space:nowrap";
        first.textContent = box.textContent;
        track.appendChild(first);
        track.appendChild(second);
        box.textContent = "";
        box.appendChild(track);

        let anim = null;
        let timer = null;
        let width = 0;

        const stop = function () {

            if (timer) {

                clearTimeout(timer);
                timer = null;
            }

            if (anim) {

                anim.cancel();
                anim = null;
            }

            track.style.transform = "none";
            first.style.marginRight = "0px";
            second.style.display = "none";
            box.style.textAlign = align;
        };

        const start = function () {

            if (!track.animate || !first.textContent) {
                return;
            }

            const textWidth = Math.ceil(first.getBoundingClientRect().width);

            width = box.clientWidth;

            if (textWidth - width <= 2) {
                return;
            }

            // A right aligned line walks from its start like any other
            box.style.textAlign = "left";
            first.style.marginRight = MARQUEE_GAP + "px";
            second.style.display = "inline-block";

            const distance = textWidth + MARQUEE_GAP;

            anim = track.animate([
                { transform: "translateX(0)", offset: 0, easing: "ease-in" },
                { transform: "translateX(" + (-distance * 0.05) + "px)", offset: 0.09, easing: "linear" },
                { transform: "translateX(" + (-distance * 0.95) + "px)", offset: 0.91, easing: "ease-out" },
                { transform: "translateX(" + (-distance) + "px)", offset: 1 }
            ], { duration: distance / MARQUEE_SPEED * 1000 });

            anim.onfinish = function () {

                anim = null;
                track.style.transform = "none";
                timer = setTimeout(function () {

                    timer = null;
                    start();
                }, MARQUEE_DELAY);
            };
        };

        // Measure again later, the text or the box changed
        const restart = function (wait) {

            stop();
            timer = setTimeout(function () {

                timer = null;
                start();
            }, wait);
        };

        const m = {
            setText: function (text) {

                const value = text || "";

                // The same line again lets a walk under way carry on
                if (first.textContent === value) {
                    return;
                }

                first.textContent = value;
                second.textContent = value;
                restart(MARQUEE_DELAY);
            },

            // After a resize, a line that now fits stops and one that no
            // longer fits starts walking
            check: function () {

                if (box.clientWidth !== width && box.offsetParent) {

                    width = box.clientWidth;
                    restart(600);
                }
            }
        };

        marquees.push(m);

        return m;
    }

    const titleLine = makeMarquee($("title"));
    const subtitleLine = makeMarquee($("subtitle"));
    const upLine = makeMarquee($("upTitle"));
    const statusLine = makeMarquee($("status"));

    window.addEventListener("resize", function () {

        for (const m of marquees) {
            m.check();
        }
    });

    setInterval(function () {

    function render() {

        const s = state;

        if (!s || !s.id) {

            titleLine.setText(online ? "Nothing playing" : "Connecting to the phone");
            subtitleLine.setText(online ? "Start a song on the phone or tap play" : "");
            paintStars(null);
            $("like").classList.remove("liked");
        } else {

            titleLine.setText(s.title);
            subtitleLine.setText(s.subtitle || "");
            paintStars(s.rating);
            $("like").classList.toggle("liked", !!s.liked);
        }

        setFlowSongs(s);

        // A new song's lyrics are put in place, not rolled from the old
        if ((s && s.id ? s.id : "") !== lyricSong) {

            lyricSong = s && s.id ? s.id : "";
            lyricBoxes.info.idx = -2;
            lyricBoxes.cover.idx = -2;
        }

        $("controls").classList.toggle("names", !!(s && s.names));
        $("lyrics").dataset.where = s && s.lyricsWhere ? s.lyricsWhere : "info";

        // What plays after this one, when the phone's settings ask for it
        const next = s && s.upNext && s.showUpNext !== false ? s.upNext : null;

        $("upNext").style.display = next ? "flex" : "none";
        upLine.setText(next ? next.title : "");

        // The waveform replaces the plain bar when the phone sends one
        const wave = s && s.wave && s.wave.length ? s.wave : null;

        $("wave").style.display = wave ? "block" : "none";
        $("track").style.visibility = wave ? "hidden" : "visible";
        waveShown = -1;

        const playing = !!(s && s.playing);

        $("playIcon").style.display = playing ? "none" : "";
        $("pauseIcon").style.display = playing ? "" : "none";
        $("shuffle").classList.toggle("on", !!(s && s.shuffle));
        $("repeat").classList.toggle("on", !!(s && s.repeat && s.repeat !== "none"));
        $("repeatOne").style.display = s && s.repeat === "one" ? "" : "none";

        if (s && s.controls) {
            layoutControls(s.controls);
        }

        // The extra buttons show what they would switch, like the phone's
        const vocals = s && s.vocals ? s.vocals : "all";

        if ($("vocBtn").dataset.shows !== vocals) {

            $("vocBtn").dataset.shows = vocals;
            setIcon($("vocBtn"), vocals === "vocal" ? "vocals" : (vocals === "instrumental" ? "instrumental" : "all"));
        }

        $("vocBtn").classList.toggle("on", vocals !== "all");
        $("pubBtn").classList.toggle("on", !!(s && s.published === "published"));
        $("pubBtn").disabled = !!(s && s.browsing);
        $("rateBtn").classList.toggle("on", !!(s && s.rating !== null && s.rating !== undefined));

        // Like the phone: a tick for published only, an open circle for all
        // songs, on the button and on the list's chip alike, and the names
        // under the buttons follow what the buttons show
        const onlyPublished = !s || s.published !== "all";
        const pubIcon = onlyPublished ? "check" : "circle";

        if ($("pubBtn").dataset.shows !== pubIcon) {

            $("pubBtn").dataset.shows = pubIcon;
            setIcon($("pubBtn"), pubIcon);
            setIcon($("feed"), pubIcon);
        }

        setLabel($("feed"), onlyPublished ? "Published" : "All songs");
        $("feed").classList.toggle("on", onlyPublished);
        $("vocalsAll").classList.toggle("on", vocals !== "vocal" && vocals !== "instrumental");
        $("vocalsVocal").classList.toggle("on", vocals === "vocal");
        $("vocalsInstr").classList.toggle("on", vocals === "instrumental");

        const rated = s && s.rating !== null && s.rating !== undefined;

        // The phone is loading songs from Mureka, shown above the list
        const libLoading = !!(s && s.loading);

        if (libLoading !== ($("libLoad").childElementCount > 0)) {

            $("libLoad").textContent = "";

            if (libLoading) {
                $("libLoad").appendChild(loadingNode("Loading songs from Mureka"));
            }
        }

        setCtlLabel("play", playing ? "pause" : "play");
        setCtlLabel("pubBtn", onlyPublished ? "public" : "all");
        setCtlLabel("vocBtn", vocals === "vocal" ? "vocals" : (vocals === "instrumental" ? "instr" : "all"));
        setCtlLabel("rateBtn", rated ? s.rating + "\u2605" : "rate");

        if ($("ratePop").style.display === "flex") {
            $("rateTitle").textContent = s && s.title ? s.title : "";
        }

        $("soundPhone").classList.toggle("on", !carAudio);
        $("soundCar").classList.toggle("on", carAudio);
        statusLine.setText(online ? (s && s.status ? s.status : "") : "Not connected to the phone");
        $("signin").style.display = online && s && s.signedIn === "no" ? "block" : "none";

        // The phone asks for the sound here but this page has not been
        // allowed to play since it loaded, so a tap is needed first
        $("overlay").style.display = online && carAudio && !unlocked ? "flex" : "none";

        syncAudio();
