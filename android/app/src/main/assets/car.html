<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1d22">
<title>Mureka Player</title>
<style>
    :root {
        --bg: #1d1d22;
        --card: #26262c;
        --line: #3a3a42;
        --text: #eaeaec;
        --muted: #9a9aa4;
        --accent: #48e1eb;
        --gold: #f5c518;
        --dim: #7d6516;
        --empty: #6a6a74;
        --heart: #ff6b8a;

        /* One height for everything in the song list's top rows */
        --ctl-h: clamp(52px, 7vh, 68px);
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 18px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
    }

    #app {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 3vh 3vw;
        gap: 2.5vh;
    }

    #main {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 4vw;
        align-items: center;
    }

    #cover {
        height: 100%;
        max-height: 62vh;
        aspect-ratio: 1 / 1;
        border-radius: 14px;
        background: var(--card) center / cover no-repeat;
        flex: 0 0 auto;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    #info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2vh;
    }

    #title {
        font-size: clamp(28px, 4.2vw, 64px);
        font-weight: 700;
        line-height: 1.1;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
    }

    #subtitle {
        font-size: clamp(18px, 2vw, 30px);
        color: var(--muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    #rateRow {
        display: flex;
        align-items: center;
        gap: 2vw;
    }

    #stars {
        display: flex;
    }

    .star {
        background: none;
        border: none;
        padding: 8px;
        cursor: pointer;
        line-height: 0;
    }

    .star svg {
        width: clamp(40px, 4.4vw, 68px);
        height: clamp(40px, 4.4vw, 68px);
        display: block;
    }

    #like {
        background: none;
        border: none;
        line-height: 0;
        color: var(--empty);
        cursor: pointer;
        padding: 8px;
    }

    #like .ico {
        width: clamp(40px, 4.4vw, 68px);
        height: clamp(40px, 4.4vw, 68px);
    }

    #like.liked,
    .rowHeart.liked {
        color: var(--heart);
    }

    #like.liked .ico,
    .rowHeart.liked .ico {
        fill: currentColor;
    }

    .ico {
        width: 1.25em;
        height: 1.25em;
        flex: 0 0 auto;
        display: block;
    }

    .chip {
        gap: 0.5em;
    }

    .chip.iconOnly {
        padding: 0 16px;
        justify-content: center;
    }

    .chip.iconOnly .ico,
    #sound .ico,
    .soundIco .ico {
        width: 1.6em;
        height: 1.6em;
    }

    .soundIco {
        color: var(--muted);
        line-height: 0;
    }

    #seek {
        display: flex;
        align-items: center;
        gap: 2vw;
        font-variant-numeric: tabular-nums;
        font-size: clamp(18px, 1.8vw, 26px);
        color: var(--muted);
    }

    #bar {
        flex: 1;
        height: 44px;
        display: flex;
        align-items: center;
        cursor: pointer;
        touch-action: none;
    }

    #track {
        position: relative;
        width: 100%;
        height: 10px;
        border-radius: 5px;
        background: #555;
    }

    #fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        border-radius: 5px;
        background: var(--accent);
    }

    #knob {
        position: absolute;
        top: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 50%;
        background: var(--accent);
        left: 0;
    }

    #controls {
        display: flex;
        gap: 1.5vw;
    }

    .ctl {
        flex: 1;
        height: clamp(72px, 12vh, 120px);
        border: none;
        border-radius: 16px;
        background: #333;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .ctl svg {
        width: 44%;
        max-width: 56px;
        height: 56%;
    }

    .ctl.on {
        background: var(--accent);
        color: #000;
    }

    .ctl.big {
        flex: 1.6;
        background: var(--accent);
        color: #000;
    }

    #bottom {
        display: flex;
        align-items: center;
        gap: 2vw;
        font-size: clamp(16px, 1.6vw, 22px);
    }

    #sound {
        display: flex;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--line);
    }

    #sound button {
        border: none;
        background: var(--card);
        color: var(--text);
        font: inherit;
        padding: 12px 22px;
        cursor: pointer;
        line-height: 0;
    }

    #sound button.on {
        background: var(--accent);
        color: #000;
        font-weight: 600;
    }

    #status {
        flex: 1;
        min-width: 0;
        color: var(--muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-align: right;
    }

    #browse {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: none;
        flex-direction: column;
        padding: 2vh 3vw;
        gap: 1.4vh;
    }

    #browseTop {
        display: flex;
        gap: 1.5vw;
        align-items: center;
    }

    #search {
        flex: 1;
        min-width: 0;
        height: var(--ctl-h);
        font: inherit;
        font-size: clamp(20px, 2vw, 30px);
        padding: 0 18px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
    }

    .chipRow {
        display: flex;
        gap: 1vw;
        flex-wrap: wrap;
        align-items: center;
    }

    .chip {
        height: var(--ctl-h);
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: clamp(15px, 1.5vw, 22px);
        padding: 0 20px;
        cursor: pointer;
        white-space: nowrap;
    }

    .chip.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
        font-weight: 600;
    }

    #creators {
        height: var(--ctl-h);
        font: inherit;
        font-size: clamp(15px, 1.5vw, 22px);
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
    }

    #counts {
        color: var(--muted);
        font-size: clamp(14px, 1.4vw, 20px);
    }

    #rows {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    .row {
        display: flex;
        align-items: center;
        gap: 2vw;
        width: 100%;
        text-align: left;
        border: none;
        border-bottom: 1px solid var(--line);
        background: none;
        color: var(--text);
        font: inherit;
        font-size: clamp(18px, 1.9vw, 28px);
        padding: 18px 8px;
        cursor: pointer;
    }

    .row.playing {
        color: var(--accent);
        font-weight: 600;
    }

    .rowTitle {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .rowRate {
        flex: 0 0 auto;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
        font-size: 0.8em;
    }

    .rowTime {
        flex: 0 0 auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 0.85em;
    }

    .rowHeart {
        flex: 0 0 auto;
        background: none;
        border: none;
        padding: 8px;
        line-height: 0;
        color: var(--empty);
        cursor: pointer;
    }

    .rowNext .ico {
        margin: 0 auto;
    }

    .rowHeart .ico {
        width: 1.4em;
        height: 1.4em;
    }

    #edgeBtn {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #edgeBtn .ico {
        width: 1.2em;
        height: 1.2em;
    }

    .rowNext {
        flex: 0 0 auto;
        width: var(--ctl-h);
        height: var(--ctl-h);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: 1.2em;
        cursor: pointer;
    }

    .row.past {
        color: var(--muted);
    }

    .rowNum {
        flex: 0 0 auto;
        min-width: 2.4em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 0.8em;
    }

    #bottom .chip {
        height: auto;
        padding: 14px 22px;
        border-radius: 12px;
    }

    .sheet {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: none;
        flex-direction: column;
        padding: 2vh 3vw;
        gap: 1.4vh;
    }

    .sheetTop {
        display: flex;
        gap: 1.5vw;
        align-items: center;
    }

    .sheetTitle {
        flex: 1;
        min-width: 0;
        font-size: clamp(22px, 2.4vw, 34px);
        font-weight: 700;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .sheetBody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        font-size: clamp(17px, 1.8vw, 26px);
    }

    .pText {
        padding: 12px 4px 4px;
        color: var(--text);
    }

    .pText.small {
        padding-top: 2px;
        color: var(--muted);
        font-size: 0.8em;
    }

    .pRow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1vw;
        padding: 6px 0;
    }

    .pRow > .pText {
        flex: 1 1 auto;
        padding: 0 4px;
    }

    .pBtn,
    .pClick {
        min-height: var(--ctl-h);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        padding: 8px 20px;
        cursor: pointer;
        margin: 4px 0;
    }

    .pClick {
        display: block;
        width: 100%;
        text-align: left;
    }

    .pBtn.on,
    .pClick.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
        font-weight: 600;
    }

    .pBtn:disabled {
        opacity: 0.4;
    }

    .pField,
    .pSelect {
        min-height: var(--ctl-h);
        font: inherit;
        padding: 0 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        margin: 4px 0;
        max-width: 100%;
    }

    .pField {
        flex: 1 1 12em;
    }

    .pStep {
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }

    .pStep span {
        min-width: 3.5em;
        text-align: center;
        font-variant-numeric: tabular-nums;
    }

    #upNext {
        display: none;
        align-items: center;
        gap: 1.5vw;
        min-width: 0;
        font-size: clamp(16px, 1.7vw, 24px);
        color: var(--muted);
    }

    #upNext .upLabel {
        flex: 0 0 auto;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.75em;
        color: var(--accent);
    }

    #upTitle {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--text);
    }

    #bar {
        position: relative;
    }

    #wave {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: none;
    }

    .thumb {
        flex: 0 0 auto;
        width: calc(var(--ctl-h) * 0.85);
        height: calc(var(--ctl-h) * 0.85);
        border-radius: 8px;
        background: var(--card) center / cover no-repeat;
    }

    #rowsWrap {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }

    #edgeBtn {
        position: absolute;
        right: 2vw;
        bottom: 2vh;
        width: calc(var(--ctl-h) * 1.2);
        height: calc(var(--ctl-h) * 1.2);
        border-radius: 50%;
        border: none;
        background: var(--accent);
        color: #000;
        font: inherit;
        font-size: 1.6em;
        font-weight: 700;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
    }

    .chip:disabled {
        opacity: 0.4;
    }

    .pClick.split {
        display: flex;
        align-items: center;
        gap: 1vw;
    }

    .pClick .pLabel {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .pClick .pCount {
        flex: 0 0 auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }

    .pClick.on .pCount {
        color: #000;
    }

    #signin {
        display: none;
        background: #5a1f2b;
        color: #fff;
        border-radius: 12px;
        padding: 14px 20px;
        font-size: clamp(18px, 1.9vw, 26px);
    }

    #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 3vh;
        font-size: clamp(22px, 2.4vw, 34px);
        text-align: center;
        padding: 5vw;
    }

    #overlay button {
        border: none;
        border-radius: 16px;
        padding: 24px 40px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }

    #resume {
        background: var(--accent);
        color: #000;
    }

    #toPhone {
        background: #333;
        color: #fff;
    }

    @media (max-aspect-ratio: 1/1) {

        #main {
            flex-direction: column;
            align-items: stretch;
        }

        #cover {
            height: auto;
            width: 100%;
            max-height: none;
            max-width: 50vh;
            align-self: center;
        }
    }
</style>
</head>
<body>
<div id="app">
    <div id="signin">Mureka Player on the phone is not signed in to Mureka. Open the app on the phone and sign in.</div>
    <div id="main">
        <div id="cover"></div>
        <div id="info">
            <div id="title">Connecting to the phone</div>
            <div id="subtitle"></div>
            <div id="rateRow">
                <div id="stars"></div>
                <button id="like" type="button" aria-label="Like" title="Like" data-icon="heart"></button>
            </div>
        </div>
    </div>
    <div id="upNext"><span class="upLabel">Up next</span><span id="upTitle"></span></div>
    <div id="seek">
        <span id="cur">0:00</span>
        <div id="bar"><div id="track"><div id="fill"></div><div id="knob"></div></div><canvas id="wave"></canvas></div>
        <span id="left">-0:00</span>
    </div>
    <div id="controls">
        <button class="ctl" id="shuffle" type="button" aria-label="Shuffle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        </button>
        <button class="ctl" id="prev" type="button" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button class="ctl big" id="play" type="button" aria-label="Play or pause">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <button class="ctl" id="next" type="button" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        </button>
        <button class="ctl" id="browseBtn" type="button" aria-label="Songs">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/><circle cx="18" cy="18" r="3"/></svg>
        </button>
        <button class="ctl" id="repeat" type="button" aria-label="Repeat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/><text id="repeatOne" x="12" y="15" font-size="8" text-anchor="middle" fill="currentColor" stroke="none" style="display:none">1</text></svg>
        </button>
    </div>
    <div id="bottom">
        <span class="soundIco" data-icon="speaker" title="Sound"></span>
        <div id="sound">
            <button id="soundPhone" type="button" class="on" data-icon="bluetooth" aria-label="Sound on the phone or Bluetooth" title="Sound on the phone or Bluetooth"></button>
            <button id="soundCar" type="button" data-icon="browser" aria-label="Sound in this browser" title="Sound in this browser"></button>
        </div>
        <div id="status"></div>
        <button class="chip iconOnly" id="fullBtn" type="button" data-icon="fullscreen" aria-label="Fullscreen" title="Fullscreen"></button>
        <button class="chip iconOnly" id="settingsBtn" type="button" data-icon="settings" aria-label="Settings" title="Settings"></button>
    </div>
</div>
<div id="browse">
    <div id="browseTop">
        <input id="search" type="search" placeholder="Search songs" autocomplete="off">
        <button class="chip iconOnly" id="clearSearch" type="button" data-icon="clearSearch" aria-label="Clear the search" title="Clear the search"></button>
        <button class="chip iconOnly" id="closeBrowse" type="button" data-icon="close" aria-label="Close" title="Close"></button>
    </div>
    <div class="chipRow">
        <button class="chip" id="viewMureka" type="button" data-icon="mureka"><span class="lbl">Mureka</span></button>
        <button class="chip" id="viewQueue" type="button" data-icon="queue"><span class="lbl">Queue</span></button>
        <button class="chip" id="viewAlpha" type="button" data-icon="alpha"><span class="lbl">A-Z</span></button>
        <button class="chip" id="toCurrent" type="button" data-icon="target"><span class="lbl">Now playing</span></button>
    </div>
    <div class="chipRow" id="filterRow">
        <button class="chip" id="vocalsAll" type="button" data-icon="all"><span class="lbl">All</span></button>
        <button class="chip" id="vocalsVocal" type="button" data-icon="vocals"><span class="lbl">Vocals</span></button>
        <button class="chip" id="vocalsInstr" type="button" data-icon="instrumental"><span class="lbl">Instrumental</span></button>
        <button class="chip" id="feed" type="button" data-icon="feed"><span class="lbl">Published</span></button>
        <button class="chip" id="smart" type="button" data-icon="filter"><span class="lbl">Filters off</span></button>
        <button class="chip" id="allFilters" type="button" data-icon="sliders"><span class="lbl">Edit filters</span></button>
        <button class="chip" id="artists" type="button" data-icon="person"><span class="lbl">Artists</span></button>
        <select id="creators"></select>
    </div>
    <div id="counts"></div>
    <div id="rowsWrap">
        <div id="rows"></div>
        <button id="edgeBtn" type="button" aria-label="Scroll to top" data-icon="arrowUp"></button>
    </div>
</div>
<div class="sheet" id="panel">
    <div class="sheetTop">
        <div class="sheetTitle" id="panelTitle"></div>
        <button class="chip iconOnly" id="closePanel" type="button" data-icon="close" aria-label="Close" title="Close"></button>
    </div>
    <div class="sheetBody" id="panelBody"></div>
</div>
<div id="overlay">
    <div>The sound is set to play in this browser. Tap to start it here.</div>
    <button id="resume" type="button">Play the sound here</button>
    <button id="toPhone" type="button">Use the phone instead</button>
</div>
<audio id="audio" preload="auto"></audio>
<script>
(function () {
    "use strict";

    const $ = function (id) {
        return document.getElementById(id);
    };

    const NS = "http://www.w3.org/2000/svg";

    // The icons, drawn like the phone player's, 24 units square with round

            const rated = r !== null && r !== undefined;

            s.outline.style.fill = level === 1 ? "var(--gold)" : "none";
            s.outline.style.stroke = level === 1 ? "var(--gold)" : (rated ? "var(--dim)" : "var(--empty)");

    // Everything that follows the state, drawn when a new one arrives
    let shownCover = "";

    function render() {

        const s = state;

        if (!s || !s.id) {

            $("title").textContent = online ? "Nothing playing" : "Connecting to the phone";
            $("subtitle").textContent = online ? "Start a song on the phone or tap play" : "";
            paintStars(null);
            $("like").classList.remove("liked");
        } else {

            $("title").textContent = s.title;
            $("subtitle").textContent = s.subtitle || "";
            paintStars(s.rating);
            $("like").classList.toggle("liked", !!s.liked);

        const cover = s && s.cover ? s.cover : "";

        if (cover !== shownCover) {

            $("cover").style.backgroundImage = cover ? "url(\"" + cover.replace(/"/g, "%22") + "\")" : "none";
        }

        $("upTitle").textContent = next ? next.title : "";

        $("pauseIcon").style.display = playing ? "" : "none";
        $("shuffle").classList.toggle("on", !!(s && s.shuffle));

        $("repeatOne").style.display = s && s.repeat === "one" ? "" : "none";

        $("soundPhone").classList.toggle("on", !carAudio);
        $("soundCar").classList.toggle("on", carAudio);

        $("signin").style.display = online && s && s.signedIn === "no" ? "block" : "none";

        syncAudio();

    // The waveform bars, played part in the accent colour, redrawn only
    // when the played part or the size moved on
    let waveShown = -1;

    function drawWave(frac) {

        const canvas = $("wave");
        const data = state && state.wave ? state.wave : null;

        if (!data || canvas.style.display === "none") {
            return;
        }

        const dpr = window.devicePixelRatio || 1;
        const w = Math.round(canvas.clientWidth * dpr);
        const h = Math.round(canvas.clientHeight * dpr);
        const barW = 3 * dpr;
        const gap = 2 * dpr;
        const count = Math.max(1, Math.floor(w / (barW + gap)));
        const played = Math.round(frac * count);
        const key = played * 100000 + w;

        if (w === 0 || h === 0 || key === waveShown) {
            return;
        }

        waveShown = key;

        if (canvas.width !== w || canvas.height !== h) {

            canvas.width = w;
            canvas.height = h;
        }

        const ctx = canvas.getContext("2d");

        ctx.clearRect(0, 0, w, h);

        for (let i = 0; i < count; i++) {

            const a = Math.floor(i * data.length / count);
            const b = Math.max(a + 1, Math.floor((i + 1) * data.length / count));
            let peak = 0;

            for (let j = a; j < b; j++) {

                if (data[j] > peak) {
                    peak = data[j];
                }
            }

            const bh = Math.max(2 * dpr, peak * (h - 2 * dpr));

            ctx.fillStyle = i < played ? "#48e1eb" : "#555";
            ctx.fillRect(i * (barW + gap), (h - bh) / 2, barW, bh);
        }
    }

    // The seek bar and the times move smoothly between the polls

        const dur = state && state.duration ? state.duration : 0;
        const pos = dragging ? dragFrac * dur : position();
        const frac = dur > 0 ? Math.min(1, pos / dur) : 0;

        $("cur").textContent = fmt(pos);
        $("left").textContent = "-" + fmt(dur - pos);

    // With the sound here, this element follows the phone, which stays in

        const num = document.createElement("span");

        row.setAttribute("role", "button");
        row.className = "row" + (item.index === pos ? " playing" : "")
            + (item.index < pos ? " past" : "");

        num.className = "rowNum";
        num.textContent = String(item.index + 1);
        row.appendChild(num);
        songLine(item, row);

        if (item.index > pos) {

            row.appendChild(lineButton("Remove from the queue", "close", function () {
                send("queueRemove", item.index).then(function () {
                    setTimeout(function () {
                        loadQueue(false);
                    }, 150);
                });
            }));
        }

        row.addEventListener("click", function () {
            send("queueJump", item.index).then(function () {
                setTimeout(function () {
                    loadQueue(false);
                }, 250);
            });
        });

        return row;
    }

    // The row a song plays from, centred in the list
    function scrollToCurrent() {

        const box = $("rows");
        const row = box.querySelector(".row.playing");

        if (row) {

            quietScroll();
            box.scrollTop = Math.max(0, row.offsetTop - box.clientHeight / 3);
        }
    }

    function paintViews() {

        $("viewMureka").classList.toggle("on", listView === "mureka");
        $("viewQueue").classList.toggle("on", listView === "queue");
        $("viewAlpha").classList.toggle("on", listView === "alpha");
    }

    function setView(view) {

        listView = view;

        try {
            localStorage.setItem("murekaCarView", view);
        } catch (e) {
            // Not kept then, only for this visit
        }

        paintViews();
        loadList(true);
    }

    // The jump button, like the phone's: scrolling down offers the end of
    // the list, scrolling up the top. It fades after a while without
    // scrolling, and the page's own scrolling does not wake it
    let lastScrollTop = 0;
    let edgeDir = "up";
    let edgeTimer = 0;
    let quietUntil = 0;

    function quietScroll() {
        quietUntil = Date.now() + 400;
    }

    function hideEdge() {

        clearTimeout(edgeTimer);
        $("edgeBtn").style.opacity = "0";
        $("edgeBtn").style.pointerEvents = "none";
    }

    function showEdge(dir) {

        edgeDir = dir;
        setIcon($("edgeBtn"), dir === "down" ? "arrowDown" : "arrowUp");
        $("edgeBtn").setAttribute("aria-label", dir === "down" ? "Scroll to end" : "Scroll to top");
        $("edgeBtn").style.opacity = "1";
        $("edgeBtn").style.pointerEvents = "auto";

        clearTimeout(edgeTimer);
        edgeTimer = setTimeout(hideEdge, 5000);
    }

    $("edgeBtn").addEventListener("click", function () {

        const box = $("rows");

        hideEdge();

        if (edgeDir === "down") {

            loadRest(function () {

                quietScroll();
                box.scrollTop = box.scrollHeight;
            });
        } else {

            quietScroll();
            box.scrollTop = 0;
        }
    });

    // One song line, shared by the song list and the queue
    function songLine(song, row) {

        const title = document.createElement("span");
        const rate = document.createElement("span");
        const time = document.createElement("span");
        const heart = document.createElement("button");

        row.appendChild(makeThumb(song.cover));

        title.className = "rowTitle";
        title.textContent = song.title;

        rate.className = "rowRate";
        rate.textContent = song.rating === null || song.rating === undefined
            ? "" : song.rating + "\u2605";

        time.className = "rowTime";
        time.textContent = fmt(song.duration);

        // A heart to like or unlike, like the phone's list. Flipped at once,
        // the phone sends the truth back with the next list
        heart.type = "button";
        heart.className = "rowHeart" + (song.liked ? " liked" : "");
        heart.setAttribute("aria-label", song.liked ? "Unlike" : "Like");
        heart.appendChild(icon("heart"));

        heart.addEventListener("click", function (ev) {

            ev.stopPropagation();
            song.liked = !song.liked;
            heart.classList.toggle("liked", song.liked);
            heart.setAttribute("aria-label", song.liked ? "Unlike" : "Like");
            send("likeId", song.id);
        });

        row.appendChild(title);
        row.appendChild(rate);
        row.appendChild(heart);
        row.appendChild(time);
    }

    // A small button at the end of a line, which must not also tap the line
    function lineButton(label, iconName, action) {

        const btn = document.createElement("button");

        btn.type = "button";
        btn.className = "rowNext";
        btn.setAttribute("aria-label", label);
        btn.title = label;
        btn.appendChild(icon(iconName));

        btn.addEventListener("click", function (ev) {

            ev.stopPropagation();
            action(btn);
        });

        return btn;
    }

    function makeRow(song) {

        // A div, since a button inside a button is not allowed
        const row = document.createElement("div");

        row.setAttribute("role", "button");
        row.className = "row" + (song.playing ? " playing" : "");
        row.dataset.id = song.id;
        songLine(song, row);

        row.appendChild(lineButton("Play next", "listPlus", function (btn) {

            send("playNext", song.id);
            setIcon(btn, "check");
        }));

        row.addEventListener("click", function () {

            send("playId", song.id);

            // Mark it at once, the next list refresh confirms it
            const before = document.querySelector(".row.playing");

            if (before) {
                before.classList.remove("playing");
            }

            row.classList.add("playing");
        });

        return row;
    }

    // The filter row follows whatever the player has set, wherever it was set
    function paintFilters(f) {

        if (!f) {
            return;
        }

        $("vocalsAll").classList.toggle("on", f.vocals !== "vocal" && f.vocals !== "instrumental");
        $("vocalsVocal").classList.toggle("on", f.vocals === "vocal");
        $("vocalsInstr").classList.toggle("on", f.vocals === "instrumental");

        setLabel($("feed"), f.published === "published" ? "Published" : "All songs");
        $("feed").classList.toggle("on", f.published === "published");

        // Like the phone's Filters on and off, parked or restored without
        // losing what is ticked, and nothing to switch when nothing is set
        setLabel($("smart"), (f.smart ? "Filters on" : "Filters off")
            + (f.smart && f.smartText ? ": " + f.smartText : ""));
        $("smart").classList.toggle("on", !!(f.smart && f.smartAny));
        $("smart").disabled = !f.smartAny;

        // The creator list only changes when one is added on the phone
        const wanted = (f.creator ? f.creator.id : "") + "|"
            + f.creators.map(function (c) {
                return c.id;
            }).join(",");

        if ($("creators").dataset.key !== wanted) {

            $("creators").dataset.key = wanted;
            $("creators").textContent = "";

            const mine = document.createElement("option");

            mine.value = "";
            mine.textContent = "My songs";
            $("creators").appendChild(mine);

            for (const c of f.creators) {

                const opt = document.createElement("option");

                opt.value = c.id;
                opt.textContent = c.name;
                $("creators").appendChild(opt);
            }

            $("creators").value = f.creator ? f.creator.id : "";
        }
    }

    // A filter command needs a moment before the list is asked again
    function filterCommand(cmd, arg) {

        send(cmd, arg).then(function () {

            setTimeout(function () {
                loadList(true);
            }, 250);
        });
    }

    // A copy of one of the phone's own panels, the settings, all the filters
    // or the artists, drawn with large controls. Every tap goes back to the
    // same button or field on the phone, then the copy is read again
    const PANEL_TITLES = { settings: "Settings", filters: "All filters", creators: "Artists" };

    let panelName = "";
    let panelTimer = null;
    let panelBusy = false;

    function panelOpen() {
        return $("panel").style.display === "flex";
    }

    function loadPanel() {

        if (!panelName || panelBusy) {
            return Promise.resolve();
        }

        panelBusy = true;

        return fetch("/panel?name=" + esc(panelName), { cache: "no-store" }).then(function (res) {
            return res.json();
        }).then(function (data) {

            panelBusy = false;

            // Never redrawn under a finger typing in one of its fields
            const typing = document.activeElement && document.activeElement.classList.contains("pField");

            if (data && data.items && panelOpen() && !typing) {
                renderPanel(data.items);
            }
        }).catch(function () {
            panelBusy = false;
        });
    }

    // After a change the phone needs a moment before it shows the result
    function panelAction(cmd, arg) {

        send(cmd, arg).then(function () {
            setTimeout(loadPanel, 250);
        });
    }

    function renderPanel(items) {

        const box = $("panelBody");
        const keep = box.scrollTop;

        box.textContent = "";

        for (const node of panelClean(items)) {
            box.appendChild(panelNode(node, false));
        }

        box.scrollTop = keep;
    }

    // The phone's own Done buttons close its panel, here Close does that, so
    // they are left out. A row left with one thing is just that thing
    function panelClean(items) {

        const out = [];

        for (const node of items) {

            if (node.t === "button" && node.s === "Done") {
                continue;
            }

            if (node.t === "row") {

                const kids = panelClean(node.c);

                if (kids.length === 1) {
                    out.push(kids[0]);
                } else if (kids.length > 1) {
                    out.push({ t: "row", c: kids });
                }

                continue;
            }

            out.push(node);
        }

        return out;
    }

    function panelNode(node, hasButtons) {

        if (node.t === "row") {

            const row = document.createElement("div");

            // A number with the phone's own minus and plus beside it only
            // needs showing, the buttons already change it
            const buttons = node.c.some(function (child) {
                return child.t === "button";
            });

            row.className = "pRow";

            for (const child of node.c) {
                row.appendChild(panelNode(child, buttons));
            }

            return row;
        }

        if (node.t === "input" && hasButtons && (node.type === "number" || node.type === "range")) {

            const shown = document.createElement("div");

            shown.className = "pText";
            shown.style.flex = "0 0 auto";
            shown.textContent = node.value === "" ? "-" : String(node.value);

            return shown;
        }

        if (node.t === "button" || node.t === "click") {

            const btn = document.createElement("button");

            btn.type = "button";
            btn.className = (node.t === "button" ? "pBtn" : "pClick") + (node.on ? " on" : "");
            btn.disabled = node.off === true;

            // A tag and its count, the count kept to the right
            if (node.parts && node.parts.length > 1) {

                const label = document.createElement("span");
                const count = document.createElement("span");

                btn.classList.add("split");
                label.className = "pLabel";
                label.textContent = node.parts[0];
                count.className = "pCount";
                count.textContent = node.parts.slice(1).join(" ");
                btn.appendChild(label);
                btn.appendChild(count);
            } else {
                btn.textContent = node.s || "?";
            }

            btn.addEventListener("click", function () {
                panelAction("hclick", node.id);
            });

            return btn;
        }

        if (node.t === "select") {

            const sel = document.createElement("select");

            sel.className = "pSelect";

            for (const pair of node.options) {

                const opt = document.createElement("option");

                opt.value = pair[0];
                opt.textContent = pair[1];
                sel.appendChild(opt);
            }

            sel.value = node.value;

            sel.addEventListener("change", function () {
                panelAction("hset", { id: node.id, value: sel.value });
            });

            return sel;
        }

        if (node.t === "input") {
            return panelInput(node);
        }

        const text = document.createElement("div");

        text.className = "pText" + (node.small ? " small" : "");
        text.textContent = node.s || "";

        return text;
    }

    function panelInput(node) {

        if (node.type === "checkbox") {

            const btn = document.createElement("button");

            btn.type = "button";
            btn.className = "pBtn" + (node.value ? " on" : "");
            btn.textContent = node.value ? "On" : "Off";

            btn.addEventListener("click", function () {
                panelAction("hset", { id: node.id, value: !node.value });
            });

            return btn;
        }

        // Numbers and sliders become a stepper, easier to hit while parked
        if (node.type === "number" || node.type === "range") {

            const box = document.createElement("span");
            const minus = document.createElement("button");
            const plus = document.createElement("button");
            const shown = document.createElement("span");
            const step = parseFloat(node.step) || 1;
            const min = node.min === "" ? -Infinity : parseFloat(node.min);
            const max = node.max === "" ? Infinity : parseFloat(node.max);

            box.className = "pStep";
            minus.type = "button";
            plus.type = "button";
            minus.className = "pBtn";
            plus.className = "pBtn";
            minus.textContent = "-";
            plus.textContent = "+";
            shown.textContent = node.value === "" ? "-" : node.value;

            const nudge = function (dir) {

                const now = parseFloat(node.value);
                let next = isNaN(now) ? (min > -Infinity ? min : 0) : now + dir * step;

                next = Math.max(min, Math.min(max, next));
                next = Math.round(next / step) * step;
                node.value = String(Number(next.toFixed(4)));
                shown.textContent = node.value;
                panelAction("hset", { id: node.id, value: node.value });
            };

            minus.addEventListener("click", function () {
                nudge(-1);
            });

            plus.addEventListener("click", function () {
                nudge(1);
            });

            box.appendChild(minus);
            box.appendChild(shown);
            box.appendChild(plus);

            return box;
        }

        const field = document.createElement("input");
        let timer = null;

        field.className = "pField";
        field.type = node.type === "search" ? "search" : "text";
        field.value = node.value || "";
        field.placeholder = node.placeholder || "";
        field.autocomplete = "off";

        field.addEventListener("input", function () {

            clearTimeout(timer);

            timer = setTimeout(function () {
                panelAction("hset", { id: node.id, value: field.value });
            }, 400);
        });

        return field;
    }

    function showPanel(name) {

        panelName = name;
        $("panelTitle").textContent = PANEL_TITLES[name] || name;
        $("panelBody").textContent = "";
        $("panel").style.display = "flex";
        loadPanel();

        // Some of it arrives later on the phone, the artist list for one
        clearInterval(panelTimer);
        panelTimer = setInterval(loadPanel, 2000);
    }

    $("closePanel").addEventListener("click", function () {

        $("panel").style.display = "none";
        clearInterval(panelTimer);
        panelTimer = null;
        panelName = "";

        // Filters or an artist may have changed what the list shows
        if ($("browse").style.display === "flex") {
            loadList(true);
        }
    });

    // Fullscreen for the car browser, where it offers it
    function fullscreenOn() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function paintFullscreen() {
        const on = fullscreenOn();

        setIcon($("fullBtn"), on ? "exitFullscreen" : "fullscreen");
        $("fullBtn").setAttribute("aria-label", on ? "Leave fullscreen" : "Fullscreen");
        $("fullBtn").title = on ? "Leave fullscreen" : "Fullscreen";
    }

    if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
        $("fullBtn").style.display = "none";
    }

    $("fullBtn").addEventListener("click", function () {

        const root = document.documentElement;

        if (fullscreenOn()) {

            if (document.exitFullscreen) {
                document.exitFullscreen().catch(function () {
                });
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        } else if (root.requestFullscreen) {
            root.requestFullscreen().catch(function () {
            });
        } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
        }
    });

    document.addEventListener("fullscreenchange", paintFullscreen);
    document.addEventListener("webkitfullscreenchange", paintFullscreen);

    $("settingsBtn").addEventListener("click", function () {
        showPanel("settings");
    });

    $("allFilters").addEventListener("click", function () {
        showPanel("filters");
    });

    $("artists").addEventListener("click", function () {
        showPanel("creators");
    });

    $("browseBtn").addEventListener("click", function () {

        $("browse").style.display = "flex";
        paintViews();
        loadList(true);
    });

    $("viewMureka").addEventListener("click", function () {
        setView("mureka");
    });

    $("viewQueue").addEventListener("click", function () {
        setView("queue");
    });

    $("viewAlpha").addEventListener("click", function () {
        setView("alpha");
    });

    // The playing song may be further down than what is loaded so far
    $("toCurrent").addEventListener("click", function () {

        if (listView === "queue" || $("rows").querySelector(".row.playing")) {

            scrollToCurrent();
            return;
        }

        loadRest(scrollToCurrent);
    });

    $("closeBrowse").addEventListener("click", function () {
        $("browse").style.display = "none";
    });

    $("clearSearch").addEventListener("click", function () {

        $("search").value = "";
        listQuery = "";
        loadList(true);
    });

    $("search").addEventListener("input", function () {

        clearTimeout(searchTimer);

        searchTimer = setTimeout(function () {

            listQuery = $("search").value.trim();
            loadList(true);
        }, 350);
    });

    $("rows").addEventListener("scroll", function () {

        const el = $("rows");
        const top = el.scrollTop;

        if (listView !== "queue" && listLoaded < listTotal && top + el.clientHeight > el.scrollHeight - 400) {
            loadList(false);
        }

        if (Date.now() > quietUntil && Math.abs(top - lastScrollTop) > 2) {
            showEdge(top > lastScrollTop ? "down" : "up");
        }

        lastScrollTop = top;
    });

    $("vocalsAll").addEventListener("click", function () {
        filterCommand("vocals", "all");
    });

    $("vocalsVocal").addEventListener("click", function () {
        filterCommand("vocals", "vocal");
    });

    $("vocalsInstr").addEventListener("click", function () {
        filterCommand("vocals", "instrumental");
    });

    $("feed").addEventListener("click", function () {
        filterCommand("feed", null);
    });

    $("smart").addEventListener("click", function () {
        filterCommand("smart", null);
    });

    $("creators").addEventListener("change", function () {
        filterCommand("creator", $("creators").value);
    });

    // The phone answers /state as soon as the player has something new,
    // at the latest after a second since the position moves on, so the page
    // follows a tap on play without waiting for the next round
    let seq = -1;

    // A play or pause shown before the phone confirms it. Until then an
    // older state still on its way is not allowed to flip the button back
    let pending = null;

    function accept(s) {

        const before = state ? state.id : null;

        if (pending && Date.now() < pending.until && s.playing !== pending.playing) {

            s.playing = pending.playing;
            s.position = position();
        } else {
            pending = null;
        }

        state = s;
        stateAt = Date.now();
        online = true;
        render();

        // Keep the open list in step when the song changes on its own,
        // without losing the place in it
        if (before !== s.id && $("browse").style.display === "flex") {

            if (listView === "queue") {
                loadQueue(false);
            } else {

                for (const row of $("rows").querySelectorAll(".row")) {
                    row.classList.toggle("playing", row.dataset.id === s.id);
                }
            }
        }
    }

    function poll() {

        // A request the network swallowed is given up, and the next asked
        const abort = window.AbortController ? new AbortController() : null;
        const timer = setTimeout(function () {

            if (abort) {
                abort.abort();
            }
        }, 10000);

        fetch("/state?since=" + seq, { cache: "no-store", signal: abort ? abort.signal : undefined }).then(function (res) {
            return res.json();
        }).then(function (s) {

            clearTimeout(timer);
            seq = typeof s.seq === "number" ? s.seq : -1;
            accept(s);
            setTimeout(poll, 0);
        }).catch(function () {

            clearTimeout(timer);
            seq = -1;
            online = false;
            render();
            setTimeout(poll, 1000);
        });
    }

    $("play").addEventListener("click", function () {

        // Shown at once, the phone confirms it a moment later
        if (state && state.id) {

            state.position = position();
            stateAt = Date.now();
            state.playing = !state.playing;
            pending = { playing: state.playing, until: Date.now() + 2000 };
            render();
        }

        send("toggle");
    });

    $("prev").addEventListener("click", function () {
        send("prev");
    });

    $("next").addEventListener("click", function () {
        send("next");
    });

    $("shuffle").addEventListener("click", function () {
        send("shuffle");
    });

    $("repeat").addEventListener("click", function () {
        send("repeat");
    });

    $("like").addEventListener("click", function () {
        send("like");
    });

    $("soundCar").addEventListener("click", function () {

        unlockAudio();
        send("carAudio", true);
    });

    $("soundPhone").addEventListener("click", function () {

        audio.pause();
        send("carAudio", false);
    });

    $("resume").addEventListener("click", function () {

        unlockAudio();
        render();
    });

    $("toPhone").addEventListener("click", function () {
        send("carAudio", false);
    });

    // Seeking, the bar follows the finger and the phone jumps on release
    const bar = $("bar");

    function barFrac(ev) {

        const r = $("track").getBoundingClientRect();

        return Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    }

    bar.addEventListener("pointerdown", function (ev) {

        if (!state || !state.duration) {
            return;
        }

        dragging = true;
        dragFrac = barFrac(ev);
        bar.setPointerCapture(ev.pointerId);
    });

    bar.addEventListener("pointermove", function (ev) {

        if (dragging) {
            dragFrac = barFrac(ev);
        }
    });

    bar.addEventListener("pointerup", function (ev) {

        if (!dragging) {
            return;
        }

        dragging = false;
        dragFrac = barFrac(ev);

        const target = dragFrac * state.duration;

        // Shown at once, the next poll confirms it
        state.position = target;
        stateAt = Date.now();
        send("seek", target);
    });

    bar.addEventListener("pointercancel", function () {
        dragging = false;
    });

    poll();
    requestAnimationFrame(tick);
})();
</script>
</body>
</html>
