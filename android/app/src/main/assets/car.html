<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1d22">
<title>Mureka Player</title>
<style>
    :root {
        --bg: #1d1d22;
        --card: #26262c;
        --line: #3a3a42;
        --text: #eaeaec;
        --muted: #9a9aa4;
        --accent: #48e1eb;
        --gold: #f5c518;
        --dim: #7d6516;
        --empty: #6a6a74;
        --heart: #ff6b8a;

        /* One height for everything in the song list's top rows */
        --ctl-h: clamp(52px, 7vh, 68px);
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 18px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
    }

    #app {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 3vh 3vw;
        gap: 2.5vh;
    }

    #main {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 4vw;
        align-items: center;
    }

    #cover {
        height: 100%;
        max-height: 62vh;
        aspect-ratio: 1 / 1;
        border-radius: 14px;
        background: var(--card) center / cover no-repeat;
        flex: 0 0 auto;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    #info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2vh;
    }

    #title {
        font-size: clamp(28px, 4.2vw, 64px);
        font-weight: 700;
        line-height: 1.1;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
    }

    #subtitle {
        font-size: clamp(18px, 2vw, 30px);
        color: var(--muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    #rateRow {
        display: flex;
        align-items: center;
        gap: 2vw;
    }

    #stars {
        display: flex;
    }

    .star {
        background: none;
        border: none;
        padding: 8px;
        cursor: pointer;
        line-height: 0;
    }

    .star svg {
        width: clamp(40px, 4.4vw, 68px);
        height: clamp(40px, 4.4vw, 68px);
        display: block;
    }

    #like {
        background: none;
        border: none;
        line-height: 0;
        color: var(--empty);
        cursor: pointer;
        padding: 8px;
    }

    #like .ico {
        width: clamp(40px, 4.4vw, 68px);
        height: clamp(40px, 4.4vw, 68px);
    }

    #like.liked,
    .rowHeart.liked {
        color: var(--heart);
    }

    #like.liked .ico,
    .rowHeart.liked .ico {
        fill: currentColor;
    }

    .ico {
        width: 1.25em;
        height: 1.25em;
        flex: 0 0 auto;
        display: block;
    }

    .chip {
        gap: 0.5em;
    }

    .chip.iconOnly {
        padding: 0 16px;
        justify-content: center;
    }

    .chip.iconOnly .ico,
    #sound .ico,
    .soundIco .ico {
        width: 1.6em;
        height: 1.6em;
    }

    .soundIco {
        color: var(--muted);
        line-height: 0;
    }

    #seek {
        display: flex;
        align-items: center;
        gap: 2vw;
        font-variant-numeric: tabular-nums;
        font-size: clamp(18px, 1.8vw, 26px);
        color: var(--muted);
    }

    #bar {
        flex: 1;
        height: 44px;
        display: flex;
        align-items: center;
        cursor: pointer;
        touch-action: none;
    }

    #track {
        position: relative;
        width: 100%;
        height: 10px;
        border-radius: 5px;
        background: #555;
    }

    #fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        border-radius: 5px;
        background: var(--accent);
    }

    #knob {
        position: absolute;
        top: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 50%;
        background: var(--accent);
        left: 0;
    }

    #controls {
        display: flex;
        gap: 1.5vw;
    }

    .ctl {
        flex: 1;
        height: clamp(72px, 12vh, 120px);
        border: none;
        border-radius: 16px;
        background: #333;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;

        /* The browser must not claim a held finger as a pan, that sends
           pointercancel and ends a move before it starts */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
    }

    .ctl svg {
        width: 44%;
        max-width: 56px;
        height: 56%;
    }

    .ctl.on {
        background: var(--accent);
        color: #000;
    }

    .ctl.big {
        flex: 1.6;
        background: var(--accent);
        color: #000;
    }

    #bottom {
        display: flex;
        align-items: center;
        gap: 2vw;
        font-size: clamp(16px, 1.6vw, 22px);
    }

    #sound {
        display: flex;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--line);
    }

    #sound button {
        border: none;
        background: var(--card);
        color: var(--text);
        font: inherit;
        padding: 12px 22px;
        cursor: pointer;
        line-height: 0;
    }

    #sound button.on {
        background: var(--accent);
        color: #000;
        font-weight: 600;
    }

    #status {
        flex: 1;
        min-width: 0;
        color: var(--muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-align: right;
    }

    #browse {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: none;
        flex-direction: column;
        padding: 2vh 3vw;
        gap: 1.4vh;
    }

    #browseTop {
        display: flex;
        gap: 1.5vw;
        align-items: center;
    }

    #search {
        flex: 1;
        min-width: 0;
        height: var(--ctl-h);
        font: inherit;
        font-size: clamp(20px, 2vw, 30px);
        padding: 0 18px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
    }

    .chipRow {
        display: flex;
        gap: 1vw;
        flex-wrap: wrap;
        align-items: center;
    }

    .chip {
        height: var(--ctl-h);
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: clamp(15px, 1.5vw, 22px);
        padding: 0 20px;
        cursor: pointer;
        white-space: nowrap;
    }

    .chip.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
        font-weight: 600;
    }

    #creators {
        height: var(--ctl-h);
        font: inherit;
        font-size: clamp(15px, 1.5vw, 22px);
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
    }

    #counts {
        color: var(--muted);
        font-size: clamp(14px, 1.4vw, 20px);
    }

    #rows {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    .row {
        display: flex;
        align-items: center;
        gap: 2vw;
        width: 100%;
        text-align: left;
        border: none;
        border-bottom: 1px solid var(--line);
        background: none;
        color: var(--text);
        font: inherit;
        font-size: clamp(18px, 1.9vw, 28px);
        padding: 18px 8px;
        cursor: pointer;
    }

    .row.playing {
        color: var(--accent);
        font-weight: 600;
    }

    .rowTitle {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .rowRate {
        flex: 0 0 auto;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
        font-size: 0.8em;
    }

    .rowTime {
        flex: 0 0 auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 0.85em;
    }

    .rowHeart {
        flex: 0 0 auto;
        background: none;
        border: none;
        padding: 8px;
        line-height: 0;
        color: var(--empty);
        cursor: pointer;
    }

    .rowNext .ico {
        margin: 0 auto;
    }

    .rowHeart .ico {
        width: 1.4em;
        height: 1.4em;
    }

    #edgeBtn {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #edgeBtn .ico {
        width: 1.2em;
        height: 1.2em;
    }

    .rowNext {
        flex: 0 0 auto;
        width: var(--ctl-h);
        height: var(--ctl-h);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: 1.2em;
        cursor: pointer;
    }

    .row.past {
        color: var(--muted);
    }

    .rowNum {
        flex: 0 0 auto;
        min-width: 2.4em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 0.8em;
    }

    #bottom .chip {
        height: auto;
        padding: 14px 22px;
        border-radius: 12px;
    }

    .sheet {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: none;
        flex-direction: column;
        padding: 2vh 3vw;
        gap: 1.4vh;
    }

    /* On a wide screen the settings and the other panels stay a readable
       column in the middle instead of stretching edge to edge */
    #panel {
        background: #111114;
        align-items: center;
    }

    .sheetInner {
        width: min(1000px, 100%);
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 1.4vh;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 2vh 2.5vw;
    }

    .row {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
    }

    .row.pressing {
        background: #2a2a31;
    }

    #songMenu,
    #helpPop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
    }

    #menuBox,
    #actionsBox,
    #helpBox {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 2vh 2vw;
        width: min(640px, 92vw);
        max-height: 88vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    #menuBox > *,
    #actionsBox > *,
    #helpBox > * {
        flex-shrink: 0;
    }

    #menuBox {
        width: min(900px, 94vw);
    }

    /* Two columns of choices where there is room, so the whole menu and its
       stars fit on a car screen without scrolling */
    #menuItems,
    #actionItems {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 12px;
    }

    @media (max-width: 700px) {

        #menuItems,
        #actionItems {
            grid-template-columns: 1fr;
        }
    }

    #menuTitle,
    #actionsTitle,
    #helpTitle {
        font-size: clamp(20px, 2.2vw, 30px);
        font-weight: 700;
        padding: 4px 6px 10px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .menuItem {
        display: flex;
        align-items: center;
        gap: 1em;
        min-height: var(--ctl-h);
        border: none;
        border-radius: 12px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: clamp(17px, 1.8vw, 24px);
        text-align: left;
        padding: 0 14px;
        cursor: pointer;
    }

    .menuItem:hover {
        background: #303038;
    }

    .menuItem.danger {
        color: #ff8a8a;
    }

    .menuItem.accent {
        color: var(--accent);
    }

    .menuItem:disabled {
        opacity: 0.4;
    }

    .menuItem .ico {
        width: 1.3em;
        height: 1.3em;
    }

    #menuStars {
        display: flex;
        justify-content: center;
        border-top: 1px solid var(--line);
        margin-top: 6px;
        padding-top: 10px;
    }

    #menuStars .star svg {
        width: clamp(48px, 6vw, 80px);
        height: clamp(48px, 6vw, 80px);
    }

    #bpmRow {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
    }

    #bpmInput {
        width: 6em;
        min-height: var(--ctl-h);
        font: inherit;
        font-size: 1.2em;
        text-align: center;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
    }

    .helpRow {
        display: flex;
        gap: 1.5em;
        padding: 6px;
        font-size: clamp(16px, 1.6vw, 22px);
    }

    .helpKey {
        flex: 0 0 5em;
        color: var(--accent);
        font-weight: 700;
        text-align: right;
    }

    .sheetTop {
        display: flex;
        gap: 1.5vw;
        align-items: center;
    }

    .sheetTitle {
        flex: 1;
        min-width: 0;
        font-size: clamp(22px, 2.4vw, 34px);
        font-weight: 700;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    /* Room for the scrollbar beside the controls, not on top of them, so a
       press meant for a button at the right edge does not grab the bar */
    .sheetBody,
    #rows,
    #menuBox,
    #actionsBox,
    #helpBox {
        scrollbar-gutter: stable;
        padding-right: 28px;
    }

    .sheetBody {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        font-size: clamp(17px, 1.8vw, 26px);
    }

    .pText {
        padding: 12px 4px 4px;
        color: var(--text);
    }

    .pText.small {
        padding-top: 2px;
        color: var(--muted);
        font-size: 0.8em;
    }

    .pRow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1vw;
        padding: 6px 0;
    }

    .pRow > .pText {
        flex: 1 1 auto;
        padding: 0 4px;
    }

    .pBtn,
    .pClick {
        min-height: var(--ctl-h);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        padding: 8px 20px;
        cursor: pointer;
        margin: 4px 0;
    }

    .pClick {
        display: block;
        width: 100%;
        text-align: left;
    }

    .pBtn.on,
    .pClick.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
        font-weight: 600;
    }

    .pBtn:disabled {
        opacity: 0.4;
    }

    .pField,
    .pSelect {
        min-height: var(--ctl-h);
        font: inherit;
        padding: 0 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        margin: 4px 0;
        max-width: 100%;
    }

    .pField {
        flex: 1 1 12em;
    }

    .pStep {
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }

    .pStep span {
        min-width: 3.5em;
        text-align: center;
        font-variant-numeric: tabular-nums;
    }

    #upNext {
        display: none;
        align-items: center;
        gap: 1.5vw;
        min-width: 0;
        font-size: clamp(16px, 1.7vw, 24px);
        color: var(--muted);
    }

    #upNext .upLabel {
        flex: 0 0 auto;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.75em;
        color: var(--accent);
    }

    #upTitle {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--text);
    }

    #bar {
        position: relative;
    }

    #wave {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: none;
    }

    .thumb {
        flex: 0 0 auto;
        width: calc(var(--ctl-h) * 0.85);
        height: calc(var(--ctl-h) * 0.85);
        border-radius: 8px;
        background: var(--card) center / cover no-repeat;
    }

    #rowsWrap {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }

    #edgeBtn {
        position: absolute;
        right: 2vw;
        bottom: 2vh;
        width: calc(var(--ctl-h) * 1.2);
        height: calc(var(--ctl-h) * 1.2);
        border-radius: 50%;
        border: none;
        background: var(--accent);
        color: #000;
        font: inherit;
        font-size: 1.6em;
        font-weight: 700;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
    }

    .chip:disabled {
        opacity: 0.4;
    }

    .pClick.split {
        display: flex;
        align-items: center;
        gap: 1vw;
    }

    .pClick .pLabel {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .pClick .pCount {
        flex: 0 0 auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }

    .pClick.on .pCount {
        color: #000;
    }

    .ctl.dragging {
        opacity: 0.6;
        outline: 3px solid var(--accent);
    }

    .ctl.holding {
        transform: scale(0.94);
        transition: transform 0.2s;
    }

    #controls .ctl .ico {
        width: 44%;
        max-width: 56px;
        height: 56%;
    }

    #ratePop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
    }

    #rateBox {
        background: var(--card);
        border-radius: 18px;
        padding: 3vh 3vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2vh;
        max-width: 90vw;
    }

    #rateTitle {
        font-size: clamp(22px, 2.4vw, 34px);
        font-weight: 700;
        max-width: 80vw;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    #rateStars {
        display: flex;
    }

    #rateStars .star svg {
        width: clamp(64px, 8vw, 110px);
        height: clamp(64px, 8vw, 110px);
    }

    #rateCaption {
        color: var(--muted);
        font-size: clamp(18px, 1.9vw, 26px);
    }

    .rowNum {
        text-align: right;
    }

    .rowDot {
        flex: 0 0 auto;
        width: 0.6em;
        height: 0.6em;
        border-radius: 50%;
        visibility: hidden;
    }

    .rowDot.both {
        visibility: visible;
        background: #48e1eb;
    }

    .rowDot.audio {
        visibility: visible;
        background: #b388ff;
    }

    .rowDot.art {
        visibility: visible;
        background: #f0a94a;
    }

    .rowDot.caching {
        visibility: visible;
        background: #48e1eb;
        animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {

        50% {
            opacity: 0.2;
        }
    }

    #lyrics {
        display: none;
        flex-direction: column;
        gap: 0.4em;
        font-size: clamp(18px, 2vw, 30px);
        color: var(--muted);
    }

    #lyrics .cur {
        color: var(--text);
        font-weight: 700;
        font-size: 1.15em;
    }

    #lyrics div {
        min-height: 1.3em;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    #actionsPop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
    }

    #blackout {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        cursor: none;
    }

    #blackMark {
        position: absolute;
        color: #333;
        font-size: 64px;
        transition: left 2s, top 2s;
    }

    .rowRate {
        min-width: 3.2em;
        text-align: right;
    }

    .rowRate.zero {
        color: var(--empty);
    }

    .rowBadge {
        flex: 0 0 auto;
        width: 4.2em;
        border-radius: 6px;
        font-size: 0.65em;
        line-height: 1.8;
        text-align: center;
        background: #2f3a3c;
        color: var(--accent);
    }

    .rowBadge.draft {
        background: #3a3226;
        color: #f0a94a;
    }

    .ceLabel {
        color: var(--muted);
        font-size: 0.85em;
        padding: 10px 4px 4px;
    }

    .ceRow {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        min-height: calc(var(--ctl-h) + 20px);
        padding: 10px;
        border: 2px dashed var(--line);
        border-radius: 12px;
        background: var(--card);
        touch-action: none;
    }

    .ceChip {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-width: calc(var(--ctl-h) * 1.3);
        height: calc(var(--ctl-h) * 1.1);
        border: none;
        border-radius: 12px;
        background: #333;
        color: #fff;
        font: inherit;
        font-size: 0.7em;
        cursor: grab;
        touch-action: none;
    }

    .ceChip .ico {
        width: 1.9em;
        height: 1.9em;
    }

    .ceChip.dragging {
        opacity: 0.4;
        outline: 3px solid var(--accent);
    }

    #signin {
        display: none;
        background: #5a1f2b;
        color: #fff;
        border-radius: 12px;
        padding: 14px 20px;
        font-size: clamp(18px, 1.9vw, 26px);
    }

    #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 3vh;
        font-size: clamp(22px, 2.4vw, 34px);
        text-align: center;
        padding: 5vw;
    }

    #overlay button {
        border: none;
        border-radius: 16px;
        padding: 24px 40px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }

    #resume {
        background: var(--accent);
        color: #000;
    }

    #toPhone {
        background: #333;
        color: #fff;
    }

    @media (max-aspect-ratio: 1/1) {

        #main {
            flex-direction: column;
            align-items: stretch;
        }

        #cover {
            height: auto;
            width: 100%;
            max-height: none;
            max-width: 50vh;
            align-self: center;
        }
    }
</style>
</head>
<body>
<div id="app">
    <div id="signin">Mureka Player on the phone is not signed in to Mureka. Open the app on the phone and sign in.</div>
    <div id="main">
        <div id="cover"></div>
        <div id="info">
            <div id="title">Connecting to the phone</div>
            <div id="subtitle"></div>
            <div id="rateRow">
                <div id="stars"></div>
                <button id="like" type="button" aria-label="Like" title="Like" data-icon="heart"></button>
            </div>
            <div id="lyrics"><div id="lyPrev"></div><div id="lyCur" class="cur"></div><div id="lyNext"></div></div>
        </div>
    </div>
    <div id="upNext"><span class="upLabel">Up next</span><span id="upTitle"></span></div>
    <div id="seek">
        <span id="cur">0:00</span>
        <div id="bar"><div id="track"><div id="fill"></div><div id="knob"></div></div><canvas id="wave"></canvas></div>
        <span id="left">-0:00</span>
    </div>
    <div id="controls">
        <button class="ctl" id="shuffle" type="button" aria-label="Shuffle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        </button>
        <button class="ctl" id="prev" type="button" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button class="ctl big" id="play" type="button" aria-label="Play or pause">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <button class="ctl" id="next" type="button" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        </button>
        <button class="ctl" id="repeat" type="button" aria-label="Repeat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/><text id="repeatOne" x="12" y="15" font-size="8" text-anchor="middle" fill="currentColor" stroke="none" style="display:none">1</text></svg>
        </button>
        <button class="ctl" id="stopBtn" type="button" aria-label="Stop" data-icon="stop"></button>
        <button class="ctl" id="pubBtn" type="button" aria-label="Published or all songs" data-icon="check"></button>
        <button class="ctl" id="vocBtn" type="button" aria-label="Vocals, instrumental or all" data-icon="all"></button>
        <button class="ctl" id="rateBtn" type="button" aria-label="Rate the playing song" data-icon="star"></button>
        <button class="ctl" id="browseBtn" type="button" aria-label="Songs">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/><circle cx="18" cy="18" r="3"/></svg>
        </button>
    </div>
    <div id="bottom">
        <span class="soundIco" data-icon="speaker" title="Sound"></span>
        <div id="sound">
            <button id="soundPhone" type="button" class="on" data-icon="bluetooth" aria-label="Sound on the phone or Bluetooth" title="Sound on the phone or Bluetooth"></button>
            <button id="soundCar" type="button" data-icon="browser" aria-label="Sound in this browser" title="Sound in this browser"></button>
        </div>
        <div id="status"></div>
        <button class="chip iconOnly" id="fullBtn" type="button" data-icon="fullscreen" aria-label="Fullscreen" title="Fullscreen"></button>
        <button class="chip iconOnly" id="actionsBtn" type="button" data-icon="menu" aria-label="Actions" title="Actions"></button>
        <button class="chip iconOnly" id="settingsBtn" type="button" data-icon="settings" aria-label="Settings" title="Settings"></button>
    </div>
</div>
<div id="browse">
    <div id="browseTop">
        <input id="search" type="search" placeholder="Search songs" autocomplete="off">
        <button class="chip iconOnly" id="clearSearch" type="button" data-icon="clearSearch" aria-label="Clear the search" title="Clear the search"></button>
        <button class="chip iconOnly" id="closeBrowse" type="button" data-icon="close" aria-label="Close" title="Close"></button>
    </div>
    <div class="chipRow">
        <button class="chip" id="viewMureka" type="button" data-icon="mureka"><span class="lbl">Mureka</span></button>
        <button class="chip" id="viewQueue" type="button" data-icon="queue"><span class="lbl">Queue</span></button>
        <button class="chip" id="viewAlpha" type="button" data-icon="alpha"><span class="lbl">A-Z</span></button>
        <button class="chip" id="toCurrent" type="button" data-icon="target"><span class="lbl">Now playing</span></button>
    </div>
    <div class="chipRow" id="filterRow">
        <button class="chip" id="vocalsAll" type="button" data-icon="all"><span class="lbl">All</span></button>
        <button class="chip" id="vocalsVocal" type="button" data-icon="vocals"><span class="lbl">Vocals</span></button>
        <button class="chip" id="vocalsInstr" type="button" data-icon="instrumental"><span class="lbl">Instrumental</span></button>
        <button class="chip" id="feed" type="button" data-icon="feed"><span class="lbl">Published</span></button>
        <button class="chip" id="smart" type="button" data-icon="filter"><span class="lbl">Filters off</span></button>
        <button class="chip" id="allFilters" type="button" data-icon="sliders"><span class="lbl">Edit filters</span></button>
        <button class="chip" id="artists" type="button" data-icon="person"><span class="lbl">Artists</span></button>
        <button class="chip" id="playlistsBtn" type="button" data-icon="playlists"><span class="lbl">Playlists</span></button>
        <select id="creators"></select>
    </div>
    <div id="counts"></div>
    <div id="rowsWrap">
        <div id="rows"></div>
        <button id="edgeBtn" type="button" aria-label="Scroll to top" data-icon="arrowUp"></button>
    </div>
</div>
<div class="sheet" id="panel">
    <div class="sheetInner">
        <div class="sheetTop">
            <div class="sheetTitle" id="panelTitle"></div>
            <button class="chip iconOnly" id="closePanel" type="button" data-icon="close" aria-label="Close" title="Close"></button>
        </div>
        <div class="sheetBody" id="panelBody"></div>
    </div>
</div>
<div id="songMenu">
    <div id="menuBox">
        <div id="menuTitle"></div>
        <div id="menuItems"></div>
        <div id="bpmRow">
            <span>BPM</span>

            <button class="chip" id="bpmClear" type="button">Clear</button>
        </div>
        <div id="menuStars"></div>
        <div id="menuCaption" class="ceLabel" style="text-align:center"></div>
    </div>
</div>
<div id="actionsPop">
    <div id="actionsBox">
        <div id="actionsTitle">Actions</div>
        <div id="actionItems"></div>
    </div>
</div>
<div id="blackout"><div id="blackMark">&#9835;</div></div>
<div id="helpPop">
    <div id="helpBox">
        <div id="helpTitle">Keyboard shortcuts</div>
        <div id="helpRows"></div>
    </div>
</div>
<div id="ratePop">
    <div id="rateBox">
        <div id="rateTitle"></div>
        <div id="rateStars"></div>
        <div id="rateCaption"></div>
    </div>
</div>
<div id="overlay">

    <button id="resume" type="button">Play the sound here</button>
    <button id="toPhone" type="button">Use the phone instead</button>
</div>

            const clip = document.createElementNS(NS, "clipPath");
            const rect = document.createElementNS(NS, "rect");

            clip.setAttribute("id", prefix + n);
            rect.setAttribute("x", "-2");
            rect.setAttribute("y", "-2");
            rect.setAttribute("width", "14");
            rect.setAttribute("height", "28");
            clip.appendChild(rect);
            defs.appendChild(clip);

            outline.setAttribute("d", STAR_D);
            outline.setAttribute("stroke-width", "1.6");
            outline.setAttribute("stroke-linejoin", "round");

    // Everything that follows the state, drawn when a new one arrives

    // The waveform bars, played part in the accent colour, redrawn only
    // when the played part or the size moved on
    let waveShown = -1;

    function drawWave(frac) {

        const canvas = $("wave");
        const data = state && state.wave ? state.wave : null;

        if (!data || canvas.style.display === "none") {
            return;
        }

        const dpr = window.devicePixelRatio || 1;
        const w = Math.round(canvas.clientWidth * dpr);
        const h = Math.round(canvas.clientHeight * dpr);
        const barW = 3 * dpr;
        const gap = 2 * dpr;
        const count = Math.max(1, Math.floor(w / (barW + gap)));
        const played = Math.round(frac * count);
        const key = played * 100000 + w;

        if (w === 0 || h === 0 || key === waveShown) {
            return;
        }

        waveShown = key;

        if (canvas.width !== w || canvas.height !== h) {

            canvas.width = w;
            canvas.height = h;
        }

        const ctx = canvas.getContext("2d");

        ctx.clearRect(0, 0, w, h);

        for (let i = 0; i < count; i++) {

            const a = Math.floor(i * data.length / count);
            const b = Math.max(a + 1, Math.floor((i + 1) * data.length / count));
            let peak = 0;

            for (let j = a; j < b; j++) {

                if (data[j] > peak) {
                    peak = data[j];
                }
            }

            const bh = Math.max(2 * dpr, peak * (h - 2 * dpr));

            ctx.fillStyle = i < played ? "#48e1eb" : "#555";
            ctx.fillRect(i * (barW + gap), (h - bh) / 2, barW, bh);

            return;

        const ms = pos * 1000;
        let idx = -1;

        for (let i = 0; i < rows.length; i++) {

            if (rows[i].t <= ms) {
                idx = i;
            } else {
                break;
            }
        }

        if (idx === lyricShown && $("lyrics").style.display === "flex") {
            return;
        }

        lyricShown = idx;
        $("lyrics").style.display = "flex";
        $("lyPrev").textContent = idx - 1 >= 0 ? rows[idx - 1].text : "";
        $("lyCur").textContent = idx >= 0 ? rows[idx].text : "";
        $("lyNext").textContent = idx + 1 < rows.length ? rows[idx + 1].text : "";

            listBusy = false;

        loadList(false, function () {

                loadRest(then);
            } else {

    // The queue, all of it as on the phone. Played songs are dimmed, a tap

    function loadQueue(reset) {

        const box = $("rows");
        const keep = box.scrollTop;

        fetch("/queue?q=" + esc(listQuery), { cache: "no-store" }).then(function (res) {
            return res.json();

            rowMeta = data.meta || rowMeta;

            let current = null;

            for (const item of data.items) {

                const row = queueRow(item, data.pos);

                if (item.index === data.pos) {
                    current = row;
                }

                box.appendChild(row);

            $("counts").textContent = "Queue, " + (data.pos + 1) + " of " + data.total

    function queueRow(item, pos) {

    // The jump button, like the phone's: scrolling down offers the end of

    // One song line, shared by the song list and the queue
    // What the phone's list shows beside the titles, sent with every list
    let rowMeta = { anyRated: false, badges: false };

    // One song line, laid out like a row in the phone's list: the number,
    // the cover, the title, the rating column once any song is rated, the
    // heart, the length, and public or draft when both kinds are listed
    function songLine(song, row) {

        const num = document.createElement("span");
        const title = document.createElement("span");
        const rate = document.createElement("span");
        const time = document.createElement("span");
        const heart = document.createElement("button");
        const rated = song.rating !== null && song.rating !== undefined;

        // The cache dot, as on the phone: cyan for song and cover, purple
        // for the song only, orange for the cover only, pulsing while caching
        const dot = document.createElement("span");

        dot.className = "rowDot" + (song.cached ? " " + song.cached : "");
        row.appendChild(dot);

        num.className = "rowNum";
        num.textContent = song.number ? String(song.number) : "";
        row.appendChild(num);
        row.appendChild(makeThumb(song.cover));

        title.className = "rowTitle";
        title.textContent = song.title;

        // Zero stars shows grey, not rated shows nothing, as on the phone
        rate.className = "rowRate" + (rated && !song.rating ? " zero" : "");
        rate.textContent = rated ? song.rating + "\u2605" : "";

        time.className = "rowTime";
        time.textContent = fmt(song.duration);

        // A heart to like or unlike, like the phone's list. Flipped at once,
        // the phone sends the truth back with the next list
        heart.type = "button";
        heart.className = "rowHeart" + (song.liked ? " liked" : "");
        heart.setAttribute("aria-label", song.liked ? "Unlike" : "Like");
        heart.appendChild(icon("heart"));

        heart.addEventListener("click", function (ev) {

            ev.stopPropagation();
            song.liked = !song.liked;
            heart.classList.toggle("liked", song.liked);
            heart.setAttribute("aria-label", song.liked ? "Unlike" : "Like");
            send("likeId", song.id);
        });

        row.appendChild(title);

        if (rowMeta.anyRated) {
            row.appendChild(rate);
        }

        row.appendChild(heart);
        row.appendChild(time);

        if (rowMeta.badges) {

            const badge = document.createElement("span");

            badge.className = "rowBadge" + (song.published ? "" : " draft");
            badge.textContent = song.published ? "public" : "draft";
            row.appendChild(badge);
        }
    }

    // A small button at the end of a line, which must not also tap the line
    function lineButton(label, iconName, action) {

        const btn = document.createElement("button");

        btn.type = "button";
        btn.className = "rowNext";
        btn.setAttribute("aria-label", label);
        btn.title = label;
        btn.appendChild(icon(iconName));

        btn.addEventListener("click", function (ev) {

            ev.stopPropagation();
            action(btn);
        });

        return btn;
    }

    // Press and hold a song, or right click it, for the same menu as the
    // phone's long press. Scrolling before the hold is up is left alone, and
    // the tap that ends a hold does not also play the song
    let rowPressTimer = 0;
    let rowPress = null;
    let rowSwallow = false;

    function attachLongPress(row, id) {

        row.addEventListener("pointerdown", function (ev) {

            if (ev.button !== undefined && ev.button !== 0) {
                return;
            }

            rowPress = { x: ev.clientX, y: ev.clientY, row: row };
            row.classList.add("pressing");
            clearTimeout(rowPressTimer);

            rowPressTimer = setTimeout(function () {

                if (!rowPress || rowPress.row !== row) {
                    return;
                }

                row.classList.remove("pressing");
                rowPress = null;
                rowSwallow = true;

                setTimeout(function () {
                    rowSwallow = false;
                }, 700);

                openSongMenu(id);
            }, 550);
        });

        const cancel = function () {

            clearTimeout(rowPressTimer);
            row.classList.remove("pressing");
            rowPress = null;
        };

        row.addEventListener("pointermove", function (ev) {

            if (rowPress && (Math.abs(ev.clientX - rowPress.x) > 10 || Math.abs(ev.clientY - rowPress.y) > 10)) {
                cancel();
            }
        });

        row.addEventListener("pointerup", cancel);
        row.addEventListener("pointercancel", cancel);
        row.addEventListener("pointerleave", cancel);

        row.addEventListener("contextmenu", function (ev) {

            ev.preventDefault();
            cancel();
            openSongMenu(id);
        });

        row.addEventListener("click", function (ev) {

            if (rowSwallow) {

                rowSwallow = false;
                ev.stopImmediatePropagation();
                ev.preventDefault();
            }
        }, true);
    }

    function makeRow(song) {

        // A div, since a button inside a button is not allowed
        const row = document.createElement("div");

        row.setAttribute("role", "button");
        row.className = "row" + (song.playing ? " playing" : "");
        row.dataset.id = song.id;
        attachLongPress(row, song.id);
        songLine(song, row);

        row.appendChild(lineButton("Play next", "listPlus", function (btn) {

            send("playNext", song.id);
            setIcon(btn, "check");
        }));

        row.addEventListener("click", function () {

            send("playId", song.id);

            // Mark it at once, the next list refresh confirms it
            const before = document.querySelector(".row.playing");

            if (before) {
                before.classList.remove("playing");
            }

            row.classList.add("playing");
        });

        return row;
    }

    // The filter row follows whatever the player has set, wherever it was set
    function paintFilters(f) {

        if (!f) {
            return;
        }

        $("vocalsAll").classList.toggle("on", f.vocals !== "vocal" && f.vocals !== "instrumental");
        $("vocalsVocal").classList.toggle("on", f.vocals === "vocal");
        $("vocalsInstr").classList.toggle("on", f.vocals === "instrumental");

        setLabel($("feed"), f.published === "published" ? "Published" : "All songs");
        $("feed").classList.toggle("on", f.published === "published");

        // Like the phone's Filters on and off, parked or restored without
        // losing what is ticked, and nothing to switch when nothing is set
        setLabel($("smart"), (f.smart ? "Filters on" : "Filters off")
            + (f.smart && f.smartText ? ": " + f.smartText : ""));
        $("smart").classList.toggle("on", !!(f.smart && f.smartAny));
        $("smart").disabled = !f.smartAny;

        // The creator list only changes when one is added on the phone
        const wanted = (f.creator ? f.creator.id : "") + "|"
            + f.creators.map(function (c) {
                return c.id;
            }).join(",");

        if ($("creators").dataset.key !== wanted) {

            $("creators").dataset.key = wanted;
            $("creators").textContent = "";

            const mine = document.createElement("option");

            mine.value = "";
            mine.textContent = "My songs";
            $("creators").appendChild(mine);

            for (const c of f.creators) {

                const opt = document.createElement("option");

                opt.value = c.id;
                opt.textContent = c.name;
                $("creators").appendChild(opt);
            }

            $("creators").value = f.creator ? f.creator.id : "";
        }
    }

    // A filter command needs a moment before the list is asked again
    function filterCommand(cmd, arg) {

        send(cmd, arg).then(function () {

            setTimeout(function () {
                loadList(true);
            }, 250);
        });
    }

    // A copy of one of the phone's own panels, the settings, all the filters
    // or the artists, drawn with large controls. Every tap goes back to the
    // same button or field on the phone, then the copy is read again
    const PANEL_TITLES = {
        settings: "Settings",
        filters: "Edit filters",
        creators: "Artists",
        info: "Information",
        playlists: "Playlists"
    };

    let panelName = "";
    let panelTimer = null;
    let panelBusy = false;

    function panelOpen() {
        return $("panel").style.display === "flex";
    }

    function loadPanel() {

        if (!panelName || panelBusy) {
            return Promise.resolve();
        }

        panelBusy = true;

        return fetch("/panel?name=" + esc(panelName), { cache: "no-store" }).then(function (res) {
            return res.json();
        }).then(function (data) {

            panelBusy = false;

            // Never redrawn under a finger typing in one of its fields, or
            // moving a button in the transport bar editor
            const typing = document.activeElement && document.activeElement.classList.contains("pField");

            if (data && data.items && panelOpen() && !typing && !editorBusy) {
                renderPanel(data.items);
            }
        }).catch(function () {
            panelBusy = false;
        });
    }

    // After a change the phone needs a moment before it shows the result
    function panelAction(cmd, arg) {

        send(cmd, arg).then(function () {
            setTimeout(loadPanel, 250);
        });
    }

    function renderPanel(items) {

        const box = $("panelBody");
        const keep = box.scrollTop;

        box.textContent = "";

        for (const node of panelClean(items)) {
            box.appendChild(panelNode(node, false));
        }

        box.scrollTop = keep;
    }

    // The phone's own Done buttons close its panel, here Close does that, so
    // they are left out. A row left with one thing is just that thing
    function panelClean(items) {

        const out = [];

        for (const node of items) {

            if (node.t === "button" && node.s === "Done") {
                continue;
            }

            if (node.t === "row") {

                const kids = panelClean(node.c);

                if (kids.length === 1) {
                    out.push(kids[0]);
                } else if (kids.length > 1) {
                    out.push({ t: "row", c: kids });
                }

                continue;
            }

            out.push(node);
        }

        return out;
    }

    function panelNode(node, hasButtons) {

        if (node.t === "row") {

            const row = document.createElement("div");

            // A number with the phone's own minus and plus beside it only
            // needs showing, the buttons already change it
            const buttons = node.c.some(function (child) {
                return child.t === "button";
            });

            row.className = "pRow";

            for (const child of node.c) {
                row.appendChild(panelNode(child, buttons));
            }

            return row;
        }

        if (node.t === "input" && hasButtons && (node.type === "number" || node.type === "range")) {

            const shown = document.createElement("div");

            shown.className = "pText";
            shown.style.flex = "0 0 auto";
            shown.textContent = node.value === "" ? "-" : String(node.value);

            return shown;
        }

        if (node.t === "button" || node.t === "click") {

            const btn = document.createElement("button");

            btn.type = "button";
            btn.className = (node.t === "button" ? "pBtn" : "pClick") + (node.on ? " on" : "");
            btn.disabled = node.off === true;

            // A tag and its count, the count kept to the right
            if (node.parts && node.parts.length > 1) {

                const label = document.createElement("span");
                const count = document.createElement("span");

                btn.classList.add("split");
                label.className = "pLabel";
                label.textContent = node.parts[0];
                count.className = "pCount";
                count.textContent = node.parts.slice(1).join(" ");
                btn.appendChild(label);
                btn.appendChild(count);
            } else {
                btn.textContent = node.s || "?";
            }

            btn.addEventListener("click", function () {
                panelAction("hclick", node.id);
            });

            return btn;
        }

        if (node.t === "select") {

            const sel = document.createElement("select");

            sel.className = "pSelect";

            for (const pair of node.options) {

                const opt = document.createElement("option");

                opt.value = pair[0];
                opt.textContent = pair[1];
                sel.appendChild(opt);
            }

            sel.value = node.value;

            sel.addEventListener("change", function () {
                panelAction("hset", { id: node.id, value: sel.value });
            });

            return sel;
        }

        if (node.t === "input") {
            return panelInput(node);
        }

        if (node.t === "controls") {
            return controlEditor(node);
        }

        const text = document.createElement("div");

        text.className = "pText" + (node.small ? " small" : "");
        text.textContent = node.s || "";

        return text;
    }

    // Move elements about and let the ones that moved slide from where they
    // were to where they are now, so the others visibly make room, like on
    // the phone
    function slideAside(els, change) {

        const before = new Map();

        for (const el of els) {
            before.set(el, el.getBoundingClientRect());
        }

        change();

        for (const el of els) {

            const was = before.get(el);

            if (!was || !el.isConnected || !el.animate) {
                continue;
            }

            const now = el.getBoundingClientRect();
            const dx = was.left - now.left;
            const dy = was.top - now.top;

            if (dx === 0 && dy === 0) {
                continue;
            }

            el.animate([
                { transform: "translate(" + dx + "px, " + dy + "px)" },
                { transform: "translate(0, 0)" }
            ], { duration: 220, easing: "cubic-bezier(0.4, 0, 0.2, 1)" });
        }
    }

    // A floating copy of what is being dragged, following the pointer. The
    // original stays in the row, faded, as the gap it will drop into
    function makeGhost(el, x, y) {

        const r = el.getBoundingClientRect();
        const ghost = el.cloneNode(true);

        ghost.removeAttribute("id");

        for (const inner of ghost.querySelectorAll("[id]")) {
            inner.removeAttribute("id");
        }

        ghost.classList.remove("holding", "dragging");
        ghost.style.position = "fixed";
        ghost.style.left = r.left + "px";
        ghost.style.top = r.top + "px";
        ghost.style.width = r.width + "px";
        ghost.style.height = r.height + "px";
        ghost.style.margin = "0";
        ghost.style.flex = "none";
        ghost.style.pointerEvents = "none";
        ghost.style.zIndex = "2147483647";
        ghost.style.transform = "scale(1.08)";
        ghost.style.boxShadow = "0 6px 16px rgba(0, 0, 0, 0.55)";
        ghost.style.opacity = "1";

        // Outside its row the copy would lose the size it inherits there
        ghost.style.fontSize = window.getComputedStyle(el).fontSize;
        document.body.appendChild(ghost);

        return { el: ghost, dx: x - r.left, dy: y - r.top };
    }

    function moveGhost(g, x, y) {

        if (g) {

            g.el.style.left = (x - g.dx) + "px";
            g.el.style.top = (y - g.dy) + "px";
        }
    }

    // The transport bar editor, like the phone's: the upper row is the bar,
    // the lower one what is not shown. Drag a button to move it, or tap it
    // to move it to the other row. Every change is saved on the phone
    let editorBusy = false;

    function controlEditor(node) {

        const wrap = document.createElement("div");
        const activeRow = document.createElement("div");
        const hiddenRow = document.createElement("div");
        const label1 = document.createElement("div");
        const label2 = document.createElement("div");
        let active = node.active.slice();
        let hidden = node.all.filter(function (name) {
            return active.indexOf(name) === -1;
        });
        const chips = {};

        label1.className = "ceLabel";
        label1.textContent = "Transport bar, drag a button to move it, tap to take it out";
        label2.className = "ceLabel";
        label2.textContent = "Not shown, tap or drag to add";
        activeRow.className = "ceRow";
        hiddenRow.className = "ceRow";

        const commit = function () {

            if (active.length === 0) {

                active = ["play"];
                hidden = hidden.filter(function (name) {
                    return name !== "play";
                });
            }

            draw();
            panelAction("setControls", active.slice());
        };

        const draw = function () {

            activeRow.textContent = "";
            hiddenRow.textContent = "";

            for (const name of active) {
                activeRow.appendChild(chips[name]);
            }

            for (const name of hidden) {
                hiddenRow.appendChild(chips[name]);
            }
        };

        // Which row and position the finger is over
        const dropAt = function (x, y, dragged) {

            for (const row of [activeRow, hiddenRow]) {

                const r = row.getBoundingClientRect();

                if (x < r.left || x > r.right || y < r.top || y > r.bottom) {
                    continue;
                }

                const list = row === activeRow ? active : hidden;
                const others = list.filter(function (name) {
                    return name !== dragged;
                });

                let index = others.length;

                for (let i = 0; i < others.length; i++) {

                    const cr = chips[others[i]].getBoundingClientRect();

                    if (y < cr.bottom && x < cr.left + cr.width / 2) {

                        index = i;
                        break;
                    }
                }

                return { list: list, index: index };
            }

            return null;
        };

        for (const name of node.all) {

            const def = CONTROLS[name] || { label: name, icon: "check" };
            const chip = document.createElement("button");
            const text = document.createElement("span");
            let start = null;
            let moved = false;

            chip.type = "button";
            chip.className = "ceChip";
            chip.appendChild(icon(def.icon));
            text.textContent = def.label;
            chip.appendChild(text);
            chips[name] = chip;

            // A mouse drags at once, a finger holds first, like on the phone.
            // The move is followed on the whole page, a floating copy follows
            // the pointer and the other buttons slide aside
            let holdTimerChip = 0;
            let ghost = null;

            const pickUp = function (x, y) {

                moved = true;
                ghost = makeGhost(chip, x, y);
                chip.style.opacity = "0.3";
            };

            const onMove = function (ev) {

                if (!start) {
                    return;
                }

                const far = Math.abs(ev.clientX - start.x) > 8 || Math.abs(ev.clientY - start.y) > 8;

                if (!moved) {

                    if (start.touch && !start.held) {

                        // A finger that moves before the hold is up lets go
                        if (far) {
                            finish(true);
                        }

                        return;
                    }

                    if (!far && !start.held) {
                        return;
                    }

                    pickUp(ev.clientX, ev.clientY);
                }

                ev.preventDefault();
                moveGhost(ghost, ev.clientX, ev.clientY);

                const at = dropAt(ev.clientX, ev.clientY, name);

                if (!at) {
                    return;
                }

                const from = active.indexOf(name) !== -1 ? active : hidden;
                const fromIndex = from.indexOf(name);

                if (from === at.list && fromIndex === at.index) {
                    return;
                }

                slideAside(Object.values(chips), function () {

                    from.splice(fromIndex, 1);
                    at.list.splice(at.index, 0, name);
                    draw();
                });
            };

            const finish = function (cancelled) {

                if (!start) {
                    return;
                }

                clearTimeout(holdTimerChip);
                document.removeEventListener("pointermove", onMove, true);
                document.removeEventListener("pointerup", onUp, true);
                document.removeEventListener("pointercancel", onCancel, true);

                const wasHeld = start.held;

                start = null;
                editorBusy = false;
                chip.style.opacity = "";

                if (ghost) {

                    ghost.el.remove();
                    ghost = null;
                }

                if (cancelled === true) {
                    return;
                }

                if (!moved && !wasHeld) {

                    // A tap moves it to the other row
                    slideAside(Object.values(chips), function () {

                        if (active.indexOf(name) !== -1) {

                            active.splice(active.indexOf(name), 1);
                            hidden.push(name);
                        } else {

                            hidden.splice(hidden.indexOf(name), 1);
                            active.push(name);
                        }

                        draw();
                    });
                }

                if (moved || !wasHeld) {
                    commit();
                }
            };

            const onUp = function () {
                finish(false);
            };

            const onCancel = function () {
                finish(false);
            };

            chip.addEventListener("pointerdown", function (ev) {

                if (start || (ev.button !== undefined && ev.button !== 0)) {
                    return;
                }

                start = { x: ev.clientX, y: ev.clientY, touch: ev.pointerType !== "mouse", held: false };
                moved = false;
                editorBusy = true;
                document.addEventListener("pointermove", onMove, true);
                document.addEventListener("pointerup", onUp, true);
                document.addEventListener("pointercancel", onCancel, true);

                if (start.touch) {

                    const x = ev.clientX;
                    const y = ev.clientY;

                    holdTimerChip = setTimeout(function () {

                        if (start && !moved) {

                            start.held = true;
                            pickUp(x, y);
                        }
                    }, 350);
                }
            });

            chip.addEventListener("contextmenu", function (ev) {
                ev.preventDefault();
            });
        }

        draw();

        wrap.appendChild(label1);
        wrap.appendChild(activeRow);
        wrap.appendChild(label2);
        wrap.appendChild(hiddenRow);

        return wrap;
    }

    function panelInput(node) {

        if (node.type === "checkbox") {

            const btn = document.createElement("button");

            btn.type = "button";
            btn.className = "pBtn" + (node.value ? " on" : "");
            btn.textContent = node.value ? "On" : "Off";

            btn.addEventListener("click", function () {
                panelAction("hset", { id: node.id, value: !node.value });
            });

            return btn;
        }

        // Numbers and sliders become a stepper, easier to hit while parked
        if (node.type === "number" || node.type === "range") {

            const box = document.createElement("span");
            const minus = document.createElement("button");
            const plus = document.createElement("button");
            const shown = document.createElement("span");
            const step = parseFloat(node.step) || 1;
            const min = node.min === "" ? -Infinity : parseFloat(node.min);
            const max = node.max === "" ? Infinity : parseFloat(node.max);

            box.className = "pStep";
            minus.type = "button";
            plus.type = "button";
            minus.className = "pBtn";
            plus.className = "pBtn";
            minus.textContent = "-";
            plus.textContent = "+";
            shown.textContent = node.value === "" ? "-" : node.value;

            const nudge = function (dir) {

                const now = parseFloat(node.value);
                let next = isNaN(now) ? (min > -Infinity ? min : 0) : now + dir * step;

                next = Math.max(min, Math.min(max, next));
                next = Math.round(next / step) * step;
                node.value = String(Number(next.toFixed(4)));
                shown.textContent = node.value;
                panelAction("hset", { id: node.id, value: node.value });
            };

            minus.addEventListener("click", function () {
                nudge(-1);
            });

            plus.addEventListener("click", function () {
                nudge(1);
            });

            box.appendChild(minus);
            box.appendChild(shown);
            box.appendChild(plus);

            return box;
        }

        const field = document.createElement("input");
        let timer = null;

        field.className = "pField";
        field.type = node.type === "search" ? "search" : "text";
        field.value = node.value || "";
        field.placeholder = node.placeholder || "";
        field.autocomplete = "off";

        field.addEventListener("input", function () {

            clearTimeout(timer);

            timer = setTimeout(function () {
                panelAction("hset", { id: node.id, value: field.value });
            }, 400);
        });

        return field;
    }

    function showPanel(name) {

        panelName = name;
        $("panelTitle").textContent = PANEL_TITLES[name] || name;
        $("panelBody").textContent = "";
        $("panel").style.display = "flex";
        loadPanel();

        // Some of it arrives later on the phone, the artist list for one
        clearInterval(panelTimer);
        panelTimer = setInterval(loadPanel, 2000);
    }

    function closePanel() {

        // The phone shows the information too, it goes away with this one
        if (panelName === "info") {
            send("closeInfo");
        }

        $("panel").style.display = "none";
        clearInterval(panelTimer);
        panelTimer = null;
        panelName = "";

        // Filters or an artist may have changed what the list shows
        if ($("browse").style.display === "flex") {
            loadList(true);
        }
    }

    $("closePanel").addEventListener("click", closePanel);

    $("playlistsBtn").addEventListener("click", function () {
        showPanel("playlists");
    });

    // Fullscreen for the car browser, where it offers it
    function fullscreenOn() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function paintFullscreen() {
        const on = fullscreenOn();

        setIcon($("fullBtn"), on ? "exitFullscreen" : "fullscreen");
        $("fullBtn").setAttribute("aria-label", on ? "Leave fullscreen" : "Fullscreen");
        $("fullBtn").title = on ? "Leave fullscreen" : "Fullscreen";
    }

    if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
        $("fullBtn").style.display = "none";
    }

    $("fullBtn").addEventListener("click", function () {

        const root = document.documentElement;

        if (fullscreenOn()) {

            if (document.exitFullscreen) {
                document.exitFullscreen().catch(function () {
                });
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        } else if (root.requestFullscreen) {
            root.requestFullscreen().catch(function () {
            });
        } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
        }
    });

    document.addEventListener("fullscreenchange", paintFullscreen);
    document.addEventListener("webkitfullscreenchange", paintFullscreen);

    $("settingsBtn").addEventListener("click", function () {
        showPanel("settings");
    });

    $("allFilters").addEventListener("click", function () {
        showPanel("filters");
    });

    $("artists").addEventListener("click", function () {
        showPanel("creators");
    });

    $("browseBtn").addEventListener("click", function () {

        $("browse").style.display = "flex";
        paintViews();
        loadList(true);
    });

    $("viewMureka").addEventListener("click", function () {
        setView("mureka");
    });

    $("viewQueue").addEventListener("click", function () {
        setView("queue");
    });

    $("viewAlpha").addEventListener("click", function () {

            $("actionsPop").style.display = "none";
        }));

        box.appendChild(menuItem("trash", Date.now() < clearArmed ? "Tap again to clear" : "Clear", function () {

            // Clearing throws the song list away, so it takes a second tap
            if (Date.now() < clearArmed) {

                clearArmed = 0;
                send("clearCache");
                $("actionsPop").style.display = "none";
                return;
            }

            clearArmed = Date.now() + 4000;
            drawActions();
        }, "danger"));

        box.appendChild(menuItem("cache", s.caching ? "Stop caching" : "Cache all", function () {

            send("cacheAll");
            $("actionsPop").style.display = "none";
        }, "accent"));

        box.appendChild(menuItem("playlists", "Playlists", function () {

            $("actionsPop").style.display = "none";
            showPanel("playlists");
        }));

        box.appendChild(menuItem("person", "Creators", function () {

            $("actionsPop").style.display = "none";
            showPanel("creators");
        }));

        box.appendChild(menuItem("moon", "Screen off", function () {

            $("actionsPop").style.display = "none";
            showBlackout();
        }));

        box.appendChild(menuItem("fullscreen", fullscreenOn() ? "Leave fullscreen" : "Fullscreen", function () {

            $("actionsPop").style.display = "none";
            $("fullBtn").click();
        }));
    }

    $("actionsBtn").addEventListener("click", function () {

        drawActions();
        $("actionsPop").style.display = "flex";
    });

    $("actionsPop").addEventListener("click", function (ev) {

        if (ev.target === $("actionsPop")) {
            $("actionsPop").style.display = "none";
        }
    });

    // Screen off, a black cover with a small mark that moves now and then so
    // nothing burns in. A tap anywhere brings the player back
    let blackTimer = 0;

    function moveMark() {

        const mark = $("blackMark");

        mark.style.left = Math.round(Math.random() * Math.max(0, window.innerWidth - 80)) + "px";
        mark.style.top = Math.round(Math.random() * Math.max(0, window.innerHeight - 80)) + "px";
    }

    function showBlackout() {

        $("blackout").style.display = "block";
        moveMark();
        clearInterval(blackTimer);
        blackTimer = setInterval(moveMark, 25000);
    }

    $("blackout").addEventListener("click", function () {

        $("blackout").style.display = "none";
        clearInterval(blackTimer);
    });

    poll();
    requestAnimationFrame(tick);
})();
</script>
</body>
</html>
