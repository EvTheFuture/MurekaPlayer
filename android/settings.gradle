// Mureka Player for Android, a WebView host for the shared src/player.js
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()

        // Only the adb library comes from JitPack
        maven {
            url = "https://jitpack.io"
            content {
                includeGroup "com.github.osservatorionessuno"
            }
        }
    }
}

rootProject.name = "MurekaPlayer"
include ":app"
